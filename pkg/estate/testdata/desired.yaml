pki:
  root:
    generationId: example-root-2026-09
    commonName: Example Root 2026-09
    organization: Example Org
    custody: aws-kms
    keyCurve: P-384
    ttl: 175200h
    maxPathLength: 3
    artifactPath: testdata/pki-roots/example-root-2026-09.yaml
  domains:
    - trustDomain: private
      mount: pki-example-private
      issuerName: example-private-2026-09
      commonName: example.private Intermediate CA
      organization: Example Org
      keyCurve: P-384
      ttl: 87600h
      maxPathLength: 2
      permittedDomains:
        - example.private
        - cluster.local
      artifactPath: testdata/pki-roots/example-root-2026-09-intermediate-private.yaml
    - trustDomain: origin
      mount: pki-origin
      issuerName: example-origin-2026-09
      commonName: example.net Origin Intermediate CA
      organization: Example Org
      keyCurve: P-384
      ttl: 87600h
      maxPathLength: 2
      permittedDomains: []
      artifactPath: testdata/pki-roots/example-root-2026-09-intermediate-origin.yaml
  legacy:
    root:
      mount: pki-example-root
      issuerName: example-root
      commonName: Example Legacy Root
      ttl: 87600h
      maxPathLength: 2
      permittedDomain: example.private
    parent:
      mount: pki-example-private
      issuerName: example-private
      commonName: example.private Legacy CA
      ttl: 43800h
      maxPathLength: 1
      permittedDomain: example.private
root:
  auth:
    - path: jwt-roster
      discoveryUrl: https://id.example.org
      roles:
        - name: roster
          boundAudiences:
            - openbao
          userClaim: sub
          groupsClaim: groups
          claimMappings:
            email: email
          ttl: 15m
  policies:
    - name: all:openbao:operator
      rules:
        - path: '*'
          capabilities:
            - create
            - read
            - update
            - patch
            - delete
            - list
            - sudo
  groups:
    - name: all:openbao:operator
      policies:
        - all:openbao:operator
      doors:
        - jwt-roster
rootOidc:
  auth:
    - path: oidc
      type: oidc
      clientId: openbao-ui
      defaultRole: roster
      discoveryUrl: https://id.example.org
      roles:
        - name: roster
          type: oidc
          boundAudiences:
            - openbao-ui
          userClaim: sub
          groupsClaim: groups
          claimMappings:
            email: email
          allowedRedirectUris:
            - https://bao.example.org/ui/vault/auth/oidc/oidc/callback
          oidcScopes:
            - profile
            - email
          ttl: 15m
  policies: []
  groups:
    - name: all:openbao:operator
      policies:
        - all:openbao:operator
      doors:
        - oidc
rootWorkloads:
  auth:
    - path: jwt-ops
      discoveryUrl: https://oidc.example.org/ops
      roles:
        - name: restore-check
          boundAudiences:
            - openbao
          boundSubject: system:serviceaccount:openbao:restore-check
          userClaim: sub
          policies:
            - restore-check
          ttl: 15m
        - name: snapshot
          boundAudiences:
            - openbao
          boundSubject: system:serviceaccount:openbao:snapshot
          userClaim: sub
          policies:
            - snapshot
          ttl: 15m
        - name: root-generation
          boundAudiences:
            - openbao
          boundSubject: system:serviceaccount:openbao:root-generation
          userClaim: sub
          policies:
            - root-generation
          ttl: 15m
        - name: plugin-catalog
          boundAudiences:
            - openbao
          boundSubject: system:serviceaccount:openbao:plugin-catalog
          userClaim: sub
          policies:
            - plugin-catalog
          ttl: 15m
  policies:
    - name: restore-check
      rules:
        - path: sys/namespaces
          capabilities:
            - list
        - path: pki-example-root/cert/ca
          capabilities:
            - read
        - path: pki-example-root/issuer/example-root/json
          capabilities:
            - read
        - path: pki-example-private/cert/ca
          capabilities:
            - read
        - path: pki-example-private/issuer/example-private/json
          capabilities:
            - read
        - path: pki-example-private/issuer/example-private-2026-09/json
          capabilities:
            - read
        - path: pki-origin/cert/ca
          capabilities:
            - read
        - path: pki-origin/issuer/example-origin-2026-09/json
          capabilities:
            - read
        - path: dev/kv/data/canary
          capabilities:
            - read
        - path: dev/pki/cert/ca
          capabilities:
            - read
        - path: dev/pki/issuer/example-root-dev/json
          capabilities:
            - read
        - path: dev/pki/cert/*
          capabilities:
            - read
        - path: dev/pki/issue/restore-check
          capabilities:
            - update
        - path: dev/pki/issuer/example-private-2026-09-dev/json
          capabilities:
            - read
        - path: dev/pki-origin/cert/ca
          capabilities:
            - read
        - path: dev/pki-origin/issuer/example-origin-2026-09-dev/json
          capabilities:
            - read
        - path: dev/pki-identity/cert/ca
          capabilities:
            - read
        - path: dev/pki-identity/issuer/example-identity-2026-09-dev-root-signed/json
          capabilities:
            - read
        - path: ops/kv/data/canary
          capabilities:
            - read
        - path: ops/pki/cert/ca
          capabilities:
            - read
        - path: ops/pki/issuer/example-root-ops/json
          capabilities:
            - read
        - path: ops/pki/cert/*
          capabilities:
            - read
        - path: ops/pki/issue/restore-check
          capabilities:
            - update
        - path: ops/pki/issuer/example-private-2026-09-ops/json
          capabilities:
            - read
        - path: ops/pki-origin/cert/ca
          capabilities:
            - read
        - path: ops/pki-origin/issuer/example-origin-2026-09-ops/json
          capabilities:
            - read
        - path: prod/kv/data/canary
          capabilities:
            - read
        - path: prod/pki/cert/ca
          capabilities:
            - read
        - path: prod/pki/issuer/example-root-prod/json
          capabilities:
            - read
        - path: prod/pki/cert/*
          capabilities:
            - read
        - path: prod/pki/issue/restore-check
          capabilities:
            - update
        - path: prod/pki/issuer/example-private-2026-09-prod/json
          capabilities:
            - read
        - path: prod/pki-origin/cert/ca
          capabilities:
            - read
        - path: prod/pki-origin/issuer/example-origin-2026-09-prod/json
          capabilities:
            - read
    - name: snapshot
      rules:
        - path: sys/storage/raft/snapshot
          capabilities:
            - read
    - name: root-generation
      rules:
        - path: sys/generate-root-token/attempt
          capabilities:
            - read
    - name: plugin-catalog
      rules:
        - path: sys/plugins/catalog/auth/aws
          capabilities:
            - read
            - sudo
  groups: []
namespaces:
  - name: dev
    kv: kv
    canary: canary
    legacyPki:
      mount: pki
      issuerName: example-root-dev
      commonName: dev.example.private Intermediate CA
      ttl: 26280h
      maxPathLength: 0
      permittedDomain: dev.example.private
      domain: dev.example.private
      leafRole: cert-manager
      leafTtl: 720h
      leafMaxTtl: 2160h
    issuingCas:
      - trustDomain: private
        mount: pki
        issuerName: example-private-2026-09-dev
        commonName: dev.example.private Issuing CA
        organization: Example Org
        keyCurve: P-384
        ttl: 26280h
        maxPathLength: 1
        permittedDomains:
          - dev.example.private
          - cluster.local
        policy: pki-private-ca
        authRole: private-ca
        roles:
          - name: private
            allowedDomains:
              - dev.example.private
            allowBareDomains: true
            allowSubdomains: true
            allowWildcardCertificates: false
            server: true
            client: true
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
          - name: workload
            allowedDomains:
              - svc.cluster.local
            allowBareDomains: false
            allowSubdomains: true
            allowWildcardCertificates: false
            server: true
            client: true
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
          - name: restore-check
            allowedDomains:
              - restore-check.dev.example.private
            allowBareDomains: true
            allowSubdomains: false
            allowWildcardCertificates: false
            server: true
            client: false
            keyCurve: P-384
            ttl: 1h
            maxTtl: 1h
        credentialRoles:
          - name: db-client
            commonName: roster-subject
            subjectMount: jwt-roster
            cnValidations:
              - email
            server: false
            client: true
            keyCurve: P-384
            ttl: 1h
            maxTtl: 1h
      - trustDomain: origin
        mount: pki-origin
        issuerName: example-origin-2026-09-dev
        commonName: dev.example.net Issuing CA
        organization: Example Org
        keyCurve: P-384
        ttl: 26280h
        maxPathLength: 1
        permittedDomains: []
        policy: pki-origin-ca
        authRole: origin-ca
        roles:
          - name: origin
            allowedDomains:
              - '*.dev.example.net'
            allowBareDomains: true
            allowSubdomains: false
            allowWildcardCertificates: true
            server: true
            client: false
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
      - trustDomain: identity
        mount: pki-identity
        issuerName: example-identity-2026-09-dev-root-signed
        commonName: dev.example.private Workload Identity CA
        organization: Example Org
        keyCurve: P-384
        ttl: 26280h
        maxPathLength: 0
        permittedDomains: []
        permittedUriDomains:
          - dev.example.private
        external: true
        policy: pki-identity-ca
        authRole: identity-ca
        roles:
          - name: identity
            allowedDomains: []
            allowBareDomains: false
            allowSubdomains: false
            allowWildcardCertificates: false
            allowedUriSans:
              - spiffe://dev.example.private/*
            server: true
            client: true
            keyCurve: P-256
            ttl: 1h
            maxTtl: 24h
            renewBefore: 10m
    ssh:
      - path: ssh
        keyType: ed25519
        roles:
          - name: ci
            allowedUsers:
              - builder
            defaultUser: builder
            keyTypes:
              - ed25519
            keyIdFormat: '{{token_display_name}}'
            extensions: []
            forceCommand: builder-serve
            ttl: 1h
            maxTtl: 1h
    sshHost:
      - path: ssh-host
        description: the dev workers' host CA
        keyType: ed25519
        roles:
          - name: worker
            allowedDomains:
              - builders.example.internal
            allowBareDomains: true
            allowSubdomains: false
            keyTypes:
              - ed25519
            keyIdFormat: '{{token_display_name}}'
            ttl: 24h
            maxTtl: 24h
    projects:
      - name: shop
        kv:
          - path: kv
            description: the shop secrets
      - name: team
        kv:
          - path: kv
            description: the team secrets
    auth:
      - path: jwt-dev
        discoveryUrl: https://oidc.example.org/dev
        roles:
          - name: app
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:external-secrets:external-secrets
            userClaim: sub
            policies:
              - eso-app
            ttl: 1h
          - name: runner-a
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:runners:a
            userClaim: sub
            policies:
              - dev:ssh:ci
            ttl: 15m
          - name: runner-b
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:runners:b
            userClaim: sub
            policies:
              - dev:ssh:ci
            ttl: 15m
          - name: worker-host
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:builders:worker
            userClaim: sub
            policies:
              - worker-sign
            ttl: 15m
          - name: cert-manager
            boundAudiences:
              - openbao-cert-manager
            boundSubject: system:serviceaccount:cert-manager:cert-manager
            userClaim: sub
            policies:
              - pki-cert-manager
            ttl: 15m
          - name: private-ca
            boundAudiences:
              - openbao-private-ca
            boundSubject: system:serviceaccount:cert-manager:cert-manager
            userClaim: sub
            policies:
              - pki-private-ca
            ttl: 15m
          - name: origin-ca
            boundAudiences:
              - openbao-origin-ca
            boundSubject: system:serviceaccount:cert-manager:cert-manager
            userClaim: sub
            policies:
              - pki-origin-ca
            ttl: 15m
          - name: identity-ca
            boundAudiences:
              - openbao-identity-ca
            boundSubject: system:serviceaccount:cert-manager:cert-manager
            userClaim: sub
            policies:
              - pki-identity-ca
            ttl: 15m
      - path: jwt-ops
        discoveryUrl: https://oidc.example.org/ops
        roles:
          - name: writer
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:platform:writer
            userClaim: sub
            policies:
              - writer
            ttl: 1h
      - path: jwt-roster
        discoveryUrl: https://id.example.org
        roles:
          - name: roster
            boundAudiences:
              - openbao
            userClaim: sub
            groupsClaim: groups
            claimMappings:
              email: email
            ttl: 1h
      - path: oidc
        type: oidc
        clientId: openbao-ui
        defaultRole: roster
        discoveryUrl: https://id.example.org
        roles:
          - name: roster
            type: oidc
            boundAudiences:
              - openbao-ui
            userClaim: sub
            groupsClaim: groups
            claimMappings:
              email: email
            allowedRedirectUris:
              - https://bao.example.org/ui/vault/auth/oidc/oidc/callback
            oidcScopes:
              - profile
              - email
            ttl: 1h
    policies:
      - name: dev:db:client
        rules:
          - path: pki/sign/db-client
            capabilities:
              - update
      - name: dev:openbao:writer
        rules:
          - path: kv/data/*
            capabilities:
              - create
              - delete
              - patch
              - read
              - update
          - path: kv/metadata/*
            capabilities:
              - delete
              - list
              - read
          - path: shop/kv/data/*
            capabilities:
              - create
              - delete
              - patch
              - read
              - update
          - path: shop/kv/metadata/*
            capabilities:
              - delete
              - list
              - read
          - path: team/kv/data/*
            capabilities:
              - create
              - delete
              - patch
              - read
              - update
          - path: team/kv/metadata/*
            capabilities:
              - delete
              - list
              - read
      - name: dev:shop:approver
        rules:
          - path: shop/kv/data/*
            capabilities:
              - create
              - delete
              - patch
              - read
              - update
          - path: shop/kv/metadata/*
            capabilities:
              - delete
              - list
              - read
      - name: dev:shop:dba
        rules:
          - path: pki/sign/db-client
            capabilities:
              - update
      - name: dev:shop:deployer
        rules:
          - path: shop/kv/data/*
            capabilities:
              - create
              - delete
              - patch
              - read
              - update
          - path: shop/kv/metadata/*
            capabilities:
              - delete
              - list
              - read
      - name: dev:shop:viewer
        rules:
          - path: shop/kv/data/*
            capabilities:
              - read
          - path: shop/kv/metadata/*
            capabilities:
              - list
              - read
      - name: dev:ssh:ci
        rules:
          - path: ssh/sign/ci
            capabilities:
              - update
            deniedParameters:
              - critical_options
      - name: dev:team:approver
        rules:
          - path: team/kv/data/*
            capabilities:
              - create
              - delete
              - patch
              - read
              - update
          - path: team/kv/metadata/*
            capabilities:
              - delete
              - list
              - read
      - name: dev:team:deployer
        rules:
          - path: team/kv/data/*
            capabilities:
              - create
              - delete
              - patch
              - read
              - update
          - path: team/kv/metadata/*
            capabilities:
              - delete
              - list
              - read
      - name: dev:team:viewer
        rules:
          - path: team/kv/data/*
            capabilities:
              - read
          - path: team/kv/metadata/*
            capabilities:
              - list
              - read
      - name: eso-app
        rules:
          - path: kv/data/app/*
            capabilities:
              - read
          - path: kv/metadata/app/*
            capabilities:
              - list
              - read
      - name: pki-cert-manager
        rules:
          - path: pki/sign/cert-manager
            capabilities:
              - update
      - name: pki-identity-ca
        rules:
          - path: pki-identity/sign/identity
            capabilities:
              - update
      - name: pki-origin-ca
        rules:
          - path: pki-origin/sign/origin
            capabilities:
              - update
      - name: pki-private-ca
        rules:
          - path: pki/sign/private
            capabilities:
              - update
          - path: pki/sign/workload
            capabilities:
              - update
          - path: pki/sign/restore-check
            capabilities:
              - update
      - name: worker-sign
        rules:
          - path: ssh-host/sign/worker
            capabilities:
              - update
      - name: writer
        rules:
          - path: kv/data/apps/*
            capabilities:
              - create
              - read
              - update
          - path: kv/metadata/apps/*
            capabilities:
              - create
              - read
              - update
    groups:
      - name: dev:db:client
        policies:
          - dev:db:client
        doors:
          - jwt-roster
          - oidc
      - name: dev:openbao:writer
        policies:
          - dev:openbao:writer
        doors:
          - jwt-roster
          - oidc
      - name: dev:shop:approver
        policies:
          - dev:shop:approver
        doors:
          - jwt-roster
          - oidc
      - name: dev:shop:dba
        policies:
          - dev:shop:dba
        doors:
          - jwt-roster
          - oidc
      - name: dev:shop:deployer
        policies:
          - dev:shop:deployer
        doors:
          - jwt-roster
          - oidc
      - name: dev:shop:viewer
        policies:
          - dev:shop:viewer
        doors:
          - jwt-roster
          - oidc
      - name: dev:team:approver
        policies:
          - dev:team:approver
        doors:
          - jwt-roster
          - oidc
      - name: dev:team:deployer
        policies:
          - dev:team:deployer
        doors:
          - jwt-roster
          - oidc
      - name: dev:team:viewer
        policies:
          - dev:team:viewer
        doors:
          - jwt-roster
          - oidc
  - name: ops
    kv: kv
    canary: canary
    legacyPki:
      mount: pki
      issuerName: example-root-ops
      commonName: ops.example.private Intermediate CA
      ttl: 26280h
      maxPathLength: 0
      permittedDomain: ops.example.private
      domain: ops.example.private
      leafRole: cert-manager
      leafTtl: 720h
      leafMaxTtl: 2160h
    issuingCas:
      - trustDomain: private
        mount: pki
        issuerName: example-private-2026-09-ops
        commonName: ops.example.private Issuing CA
        organization: Example Org
        keyCurve: P-384
        ttl: 26280h
        maxPathLength: 1
        permittedDomains:
          - ops.example.private
          - cluster.local
        policy: pki-private-ca
        authRole: private-ca
        roles:
          - name: private
            allowedDomains:
              - ops.example.private
            allowBareDomains: true
            allowSubdomains: true
            allowWildcardCertificates: false
            server: true
            client: true
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
          - name: workload
            allowedDomains:
              - svc.cluster.local
            allowBareDomains: false
            allowSubdomains: true
            allowWildcardCertificates: false
            server: true
            client: true
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
          - name: restore-check
            allowedDomains:
              - restore-check.ops.example.private
            allowBareDomains: true
            allowSubdomains: false
            allowWildcardCertificates: false
            server: true
            client: false
            keyCurve: P-384
            ttl: 1h
            maxTtl: 1h
        credentialRoles:
          - name: db-client
            commonName: roster-subject
            subjectMount: jwt-roster
            cnValidations:
              - email
            server: false
            client: true
            keyCurve: P-384
            ttl: 1h
            maxTtl: 1h
      - trustDomain: origin
        mount: pki-origin
        issuerName: example-origin-2026-09-ops
        commonName: ops.example.net Issuing CA
        organization: Example Org
        keyCurve: P-384
        ttl: 26280h
        maxPathLength: 1
        permittedDomains: []
        policy: pki-origin-ca
        authRole: origin-ca
        roles:
          - name: origin
            allowedDomains:
              - console.example.net
            allowBareDomains: true
            allowSubdomains: false
            allowWildcardCertificates: true
            server: true
            client: false
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
    ssh:
      - path: ssh
        keyType: ed25519
        roles:
          - name: user
            allowedUsers:
              - ops
            defaultUser: ops
            keyTypes:
              - ed25519
            keyIdFormat: '{{token_display_name}}'
            extensions:
              - permit-pty
            ttl: 1h
            maxTtl: 1h
    auth:
      - path: jwt-ops
        discoveryUrl: https://oidc.example.org/ops
        roles:
          - name: app
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:external-secrets:external-secrets
            userClaim: sub
            policies:
              - eso-app
            ttl: 1h
          - name: platform
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:external-secrets:external-secrets
            userClaim: sub
            policies:
              - eso-platform
            ttl: 1h
          - name: svc-config
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:external-secrets:external-secrets
            userClaim: sub
            policies:
              - svc-config
            ttl: 1h
          - name: svc-clients
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:external-secrets:external-secrets
            userClaim: sub
            policies:
              - svc-clients
            ttl: 1h
          - name: svc-export-app
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:external-secrets:external-secrets
            userClaim: sub
            policies:
              - svc-export-app
            ttl: 1h
          - name: writer
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:platform:writer
            userClaim: sub
            policies:
              - writer
            ttl: 1h
          - name: svc
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:svc:svc
            userClaim: sub
            policies:
              - svc
            ttl: 1h
          - name: exporter
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:platform:exporter
            userClaim: sub
            policies:
              - exporter
            ttl: 1h
          - name: cert-manager
