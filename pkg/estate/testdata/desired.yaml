      mount: pki
      issuerName: example-root-prod
      commonName: prod.example.private Intermediate CA
      ttl: 26280h
      maxPathLength: 0
      permittedDomain: prod.example.private
      domain: prod.example.private
      leafRole: cert-manager
      leafTtl: 720h
      leafMaxTtl: 2160h
    issuingCas:
      - trustDomain: private
        mount: pki
        issuerName: example-private-2026-09-prod
        commonName: prod.example.private Issuing CA
        organization: Example Org
        keyCurve: P-384
        ttl: 26280h
        maxPathLength: 1
        permittedDomains:
          - prod.example.private
          - cluster.local
        policy: pki-private-ca
        authRole: private-ca
        roles:
          - name: private
            allowedDomains:
              - prod.example.private
            allowBareDomains: true
            allowSubdomains: true
            allowWildcardCertificates: false
            server: true
            client: true
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
          - name: workload
            allowedDomains:
              - svc.cluster.local
            allowBareDomains: false
            allowSubdomains: true
            allowWildcardCertificates: false
            server: true
            client: true
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
          - name: restore-check
            allowedDomains:
              - restore-check.prod.example.private
            allowBareDomains: true
            allowSubdomains: false
            allowWildcardCertificates: false
            server: true
            client: false
            keyCurve: P-384
            ttl: 1h
            maxTtl: 1h
