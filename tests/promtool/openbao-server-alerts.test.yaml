# Unit tests for charts/openbao-ops' server alerts, run by
# conformance/server_alert_rules_test.go against the rules the chart renders
# for tests/cases/openbao-ops/server-metrics (rules.yaml is that render).
# Series are what OpenBAO exposes on /v1/sys/metrics, with the `namespace`
# and `pod` labels the scrape adds; the case's extra matcher is
# k8s_cluster_name="example".
rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  - name: a sealed pod fires after five minutes
    interval: 1m
    input_series:
      - series: 'vault_core_unsealed{namespace="openbao",k8s_cluster_name="example",pod="openbao-1"}'
        values: '1 1 0x10'
      - series: 'vault_core_unsealed{namespace="openbao",k8s_cluster_name="example",pod="openbao-0"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 4m
        alertname: OpenBAOSealed
        exp_alerts: []
      - eval_time: 10m
        alertname: OpenBAOSealed
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              namespace: openbao
              k8s_cluster_name: example
              pod: openbao-1
            exp_annotations:
              summary: OpenBAO pod openbao-1 is sealed
              description: >-
                OpenBAO pod openbao-1 has been sealed since before this alert's window and serves nothing. With auto-unseal it should unseal on start: look at the pod's log for the seal's error (a KMS permission, an unreachable endpoint, a missing plugin binary). Runbook: docs/server.md, "The seal as a plugin".

  - name: no active node fires when every pod is a standby, and when nothing is scraped
    interval: 1m
    input_series:
      - series: 'vault_core_active{namespace="openbao",k8s_cluster_name="example",pod="openbao-0"}'
        values: '1 1 0x10'
      - series: 'vault_core_active{namespace="openbao",k8s_cluster_name="example",pod="openbao-1"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: OpenBAONoActiveNode
        exp_alerts: []
      - eval_time: 8m
        alertname: OpenBAONoActiveNode
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
            exp_annotations:
              summary: OpenBAO has no active node
              description: >-
                No OpenBAO pod reports itself active: no leader is elected, or none can be scraped. Every client is failing. Check for a lost Raft quorum (kubectl -n openbao get pods; the pods' log for "election") and for sealed pods.

  - name: a healthy cluster fires nothing
    interval: 1m
    input_series:
      - series: 'vault_core_unsealed{namespace="openbao",k8s_cluster_name="example",pod="openbao-0"}'
        values: '1x30'
      - series: 'vault_core_active{namespace="openbao",k8s_cluster_name="example",pod="openbao-0"}'
        values: '1x30'
      - series: 'vault_core_active{namespace="openbao",k8s_cluster_name="example",pod="openbao-1"}'
        values: '0x30'
      - series: 'vault_autopilot_healthy{namespace="openbao",k8s_cluster_name="example",pod="openbao-0"}'
        values: '1x30'
      - series: 'vault_autopilot_node_healthy{namespace="openbao",k8s_cluster_name="example",pod="openbao-0",node_id="openbao-0"}'
        values: '1x30'
      - series: 'vault_autopilot_node_healthy{namespace="openbao",k8s_cluster_name="example",pod="openbao-0",node_id="openbao-1"}'
        values: '1x30'
      - series: 'vault_autopilot_node_healthy{namespace="openbao",k8s_cluster_name="example",pod="openbao-0",node_id="openbao-2"}'
        values: '1x30'
      - series: 'vault_raft_storage_follower_applied_index_delta{namespace="openbao",k8s_cluster_name="example",pod="openbao-1"}'
        values: '3x30'
      - series: 'vault_core_handle_request{namespace="openbao",k8s_cluster_name="example",pod="openbao-0",quantile="0.99"}'
        values: '40x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OpenBAOSealed
        exp_alerts: []
      - eval_time: 25m
        alertname: OpenBAONoActiveNode
        exp_alerts: []
      - eval_time: 25m
        alertname: OpenBAORaftUnhealthy
        exp_alerts: []
      - eval_time: 25m
        alertname: OpenBAORaftCommitLag
        exp_alerts: []
      - eval_time: 25m
        alertname: OpenBAOHighRequestLatency
        exp_alerts: []
      - eval_time: 25m
        alertname: OpenBAOMetricsAbsent
        exp_alerts: []

  - name: fewer than three healthy voters, from the node count or from autopilot
    interval: 1m
    input_series:
      - series: 'vault_core_active{namespace="openbao",k8s_cluster_name="example",pod="openbao-0"}'
        values: '1x30'
      - series: 'vault_autopilot_node_healthy{namespace="openbao",k8s_cluster_name="example",pod="openbao-0",node_id="openbao-0"}'
        values: '1x30'
      - series: 'vault_autopilot_node_healthy{namespace="openbao",k8s_cluster_name="example",pod="openbao-0",node_id="openbao-1"}'
        values: '1x30'
      - series: 'vault_autopilot_node_healthy{namespace="openbao",k8s_cluster_name="example",pod="openbao-0",node_id="openbao-2"}'
        values: '1x5 0x25'
    alert_rule_test:
      - eval_time: 9m
        alertname: OpenBAORaftUnhealthy
        exp_alerts: []
      - eval_time: 20m
        alertname: OpenBAORaftUnhealthy
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
            exp_annotations:
              summary: OpenBAO has fewer than 3 healthy Raft voters
              description: >-
                Autopilot (read from the active node) counts fewer than 3 healthy voters, or reports the cluster unhealthy. One more failure may cost quorum. See which node: bao operator raft autopilot state (needs a token); then that pod's log and storage.

  - name: a follower far behind the leader
    interval: 1m
    input_series:
      - series: 'vault_core_active{namespace="openbao",k8s_cluster_name="example",pod="openbao-2"}'
        values: '0x30'
      - series: 'vault_core_active{namespace="openbao",k8s_cluster_name="example",pod="openbao-1"}'
        values: '0x30'
      - series: 'vault_raft_storage_follower_applied_index_delta{namespace="openbao",k8s_cluster_name="example",pod="openbao-2"}'
        values: '2000x30'
      - series: 'vault_raft_storage_follower_applied_index_delta{namespace="openbao",k8s_cluster_name="example",pod="openbao-1"}'
        values: '10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: OpenBAORaftCommitLag
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              namespace: openbao
              k8s_cluster_name: example
              pod: openbao-2
            exp_annotations:
              summary: OpenBAO pod openbao-2 is 2000 Raft log entries behind the leader
              description: >-
                Pod openbao-2 has applied 2000 fewer Raft log entries than the leader for longer than this alert's window. A follower that cannot keep up is a slow disk, a network problem between pods, or a node under memory pressure; it cannot take over cleanly while it lags.

  - name: an audit failure counted in the last five minutes
    interval: 1m
    input_series:
      - series: 'vault_audit_log_request_failure{namespace="openbao",k8s_cluster_name="example",pod="openbao-0"}'
        values: '0x5 1 2 3 3x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: OpenBAOAuditLogFailures
        exp_alerts: []
      - eval_time: 8m
        alertname: OpenBAOAuditLogFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              namespace: openbao
              k8s_cluster_name: example
              pod: openbao-0
            exp_annotations:
              summary: OpenBAO audit devices are failing on openbao-0
              description: >-
                An audit log request or response failed on pod openbao-0. OpenBAO refuses the request it cannot audit, so clients see errors and no audit trail exists for them. Look at the audit device the pod declares (a stdout device fails when the log pipe is blocked) and at the pod's log.

  - name: p99 latency above a second for fifteen minutes
    interval: 1m
    input_series:
      - series: 'vault_core_handle_request{namespace="openbao",k8s_cluster_name="example",pod="openbao-0",quantile="0.99"}'
        values: '50x3 2500x30'
      - series: 'vault_core_handle_request{namespace="openbao",k8s_cluster_name="example",pod="openbao-0",quantile="0.5"}'
        values: '3000x33'
    alert_rule_test:
      - eval_time: 10m
        alertname: OpenBAOHighRequestLatency
        exp_alerts: []
      - eval_time: 25m
        alertname: OpenBAOHighRequestLatency
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              namespace: openbao
              k8s_cluster_name: example
              pod: openbao-0
              quantile: "0.99"
            exp_annotations:
              summary: OpenBAO p99 request latency on openbao-0 is 2500 ms
              description: >-
                The 99th percentile of non-login request handling time on pod openbao-0 has been above this alert's threshold for longer than its window. Suspects: storage latency (the Raft disk), a burst of large requests, an audit device that blocks, or CPU throttling at the pod's limit.

  - name: a series that is gone for fifteen minutes is absence, not health
    interval: 1m
    input_series:
      - series: 'vault_core_unsealed{namespace="openbao",k8s_cluster_name="example",pod="openbao-0"}'
        values: '1x3'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpenBAOMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              namespace: openbao
              k8s_cluster_name: example
            exp_annotations:
              summary: No OpenBAO metrics are being scraped
              description: >-
                No vault_core_unsealed series exists for namespace openbao: every OpenBAO alert is blind. The server's metrics listener (metrics_only and unauthenticated_metrics_access) may be off, or nothing scrapes the pods.

  - name: gauges a former leader still exports after a leadership change are not counted
    interval: 1m
    input_series:
      # openbao-0 was the leader and still exports its last autopilot view
      # (a voter unhealthy) and openbao-1 its last follower lag; openbao-1 is
      # the leader now and reports three healthy voters.
      - series: 'vault_core_active{namespace="openbao",k8s_cluster_name="example",pod="openbao-0"}'
        values: '0x30'
      - series: 'vault_core_active{namespace="openbao",k8s_cluster_name="example",pod="openbao-1"}'
        values: '1x30'
      - series: 'vault_autopilot_node_healthy{namespace="openbao",k8s_cluster_name="example",pod="openbao-0",node_id="openbao-2"}'
        values: '0x30'
      - series: 'vault_autopilot_healthy{namespace="openbao",k8s_cluster_name="example",pod="openbao-0"}'
        values: '0x30'
      - series: 'vault_autopilot_node_healthy{namespace="openbao",k8s_cluster_name="example",pod="openbao-1",node_id="openbao-0"}'
        values: '1x30'
      - series: 'vault_autopilot_node_healthy{namespace="openbao",k8s_cluster_name="example",pod="openbao-1",node_id="openbao-1"}'
        values: '1x30'
      - series: 'vault_autopilot_node_healthy{namespace="openbao",k8s_cluster_name="example",pod="openbao-1",node_id="openbao-2"}'
        values: '1x30'
      - series: 'vault_autopilot_healthy{namespace="openbao",k8s_cluster_name="example",pod="openbao-1"}'
        values: '1x30'
      - series: 'vault_raft_storage_follower_applied_index_delta{namespace="openbao",k8s_cluster_name="example",pod="openbao-1"}'
        values: '9000x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OpenBAORaftUnhealthy
        exp_alerts: []
      - eval_time: 25m
        alertname: OpenBAORaftCommitLag
        exp_alerts: []
