# An origin, not an endpoint: the chart appends the v2 API's path, and a
# value that is not an http(s) origin is a job that posts nowhere.
pluginCatalog:
  enabled: true
  plugins:
    - type: secret
      name: openbao-plugin-example
      version: v1.2.3
  alert:
    alertmanager: {enabled: true, url: alertmanager.example.svc:9093}
