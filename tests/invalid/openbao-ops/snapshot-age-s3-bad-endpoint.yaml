snapshotAge:
  enabled: true
  stores:
    - name: primary
      prefix: raft/
      maxAgeSeconds: 43200
      s3: {enabled: true, bucket: example-openbao-backups, region: r, endpoint: "s3://objects.example.internal"}
  alert:
    sns: {enabled: true, topicArn: example-topic, region: eu-example-1}
