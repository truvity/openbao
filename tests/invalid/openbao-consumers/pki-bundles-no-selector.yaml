# A selector is required; {} says every namespace on purpose.
server: https://openbao.example.internal:8200
caBundle: Zm9v
pki:
  enabled: true
  trustAnchors:
    - {name: example-root, certificate: Zm9v}

  bundles:
    - name: example-identity
      sources: [{inLine: "-----BEGIN CERTIFICATE-----\nZm9v\n-----END CERTIFICATE-----\n"}]
      target: {key: x.pem}
