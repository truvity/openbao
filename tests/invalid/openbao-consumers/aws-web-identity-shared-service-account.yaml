# One ServiceAccount carries one role: two stores cannot share it.
aws:
  identity: webIdentity
awsStores:
  - name: app-config
    region: eu-example-1
    role: arn:aws:iam::444455556666:role/app-config
    auth:
      jwt:
        serviceAccountRef: {name: shared, namespace: external-secrets}
    conditions: [{namespaces: [a]}]
  - name: app-credentials
    region: eu-example-1
    role: arn:aws:iam::444455556666:role/app-credentials
    auth:
      jwt:
        serviceAccountRef: {name: shared, namespace: external-secrets}
    serviceAccount: {create: false}
    conditions: [{namespaces: [b]}]
