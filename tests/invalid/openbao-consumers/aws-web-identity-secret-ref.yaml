# The chart renders one auth shape: jwt.serviceAccountRef.
aws:
  identity: webIdentity
awsStores:
  - name: app-config
    region: eu-example-1
    role: arn:aws:iam::444455556666:role/app-config
    auth:
      secretRef:
        accessKeyIDSecretRef: {name: keys, key: id}
    conditions: [{namespaces: [a]}]
