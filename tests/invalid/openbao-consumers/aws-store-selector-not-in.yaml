# NotIn selects every namespace nobody labelled.
aws:
  identity: podIdentity
awsStores:
  - name: app-config
    region: eu-example-1
    role: arn:aws:iam::444455556666:role/app-config
    conditions:
      - namespaceSelector:
          matchExpressions: [{key: example.com/tier, operator: NotIn, values: [restricted]}]
