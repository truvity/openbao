# A policy whose failures are ignored, in podIdentity mode, needs the
# acknowledgement.
aws:
  identity: podIdentity
  admissionPolicy:
    failurePolicy: Ignore
awsStores:
  - name: app-config
    region: eu-example-1
    role: arn:aws:iam::444455556666:role/app-config
    conditions: [{namespaces: [a]}]
