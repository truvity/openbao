# Source: openbao-ops/templates/restore-check.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-restore-check
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-restore-check
    app.kubernetes.io/part-of: openbao
spec:
  schedule: "37 5 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-restore-check
        spec:
          serviceAccountName: openbao-restore-check
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: fetch
              image: amazon/aws-cli:2.36.44
              command:
                - /bin/sh
                - -ec
                - |
                  printf '[default]\ns3 =\n  addressing_style = path\n' > /tmp/aws-config
                  newest=$(aws s3api list-objects-v2 --bucket example-openbao-backups --prefix raft/ \
                    --query 'sort_by(Contents, &LastModified)[-1].[Key, LastModified]' --output text)
                  set -- $newest
                  key=$1
                  age=$(( $(date +%s) - $(date -d "$2" +%s) ))
                  echo "newest snapshot: $key, $((age / 60)) minutes old"
                  if [ "$age" -gt 43200 ]; then
                    echo "the newest snapshot is older than 12 hours: the snapshot job is not running"
                    exit 1
                  fi
                  aws s3 cp "s3://example-openbao-backups/$key" /work/openbao.snap --no-progress
                  echo "$key" > /work/key
              env:
                - name: AWS_REGION
                  value: example
                - name: AWS_ENDPOINT_URL_S3
                  value: "https://objects.example.internal"
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
                - name: AWS_CONFIG_FILE
                  value: /tmp/aws-config
                - name: HOME
                  value: /tmp
              envFrom:
                - secretRef:
                    name: openbao-backup-keys
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
            - name: server
              restartPolicy: Always
              image: openbao/openbao:2.6.2
              command: [bao, server, -config=/etc/openbao/scratch.hcl]
              volumeMounts:
                - name: config
                  mountPath: /etc/openbao
                  readOnly: true
                - name: data
                  mountPath: /data
                - name: server-tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: check
              image: openbao/openbao:2.6.2
              command:
                - /bin/sh
                - -ec
                - |
                  # bao status: 0 unsealed, 2 sealed or uninitialized, 1 unreachable.
                  wait_for() {
                    i=0
                    while [ "$i" -lt 90 ]; do
                      rc=0
                      bao status >/dev/null 2>&1 || rc=$?
                      case "$1:$rc" in any:0|any:2|unsealed:0) return 0 ;; esac
                      i=$((i + 1))
                      sleep 2
                    done
                    echo "the scratch server never became $1 (bao status exit $rc)"
                    bao status || true
                    return 1
                  }

                  wait_for any
                  # Recovery shares of a throwaway install: never printed, gone with the pod.
                  BAO_TOKEN=$(bao operator init -recovery-shares=1 -recovery-threshold=1 -format=json |
                    sed -n 's/^ *"root_token": *"\([^"]*\)".*/\1/p')
                  [ -n "$BAO_TOKEN" ] || { echo "initializing the scratch server returned no root token"; exit 1; }
                  export BAO_TOKEN
                  wait_for unsealed

                  # -force: the snapshot carries production's keyring, not the scratch's.
                  # Judge by exit code; 2.x prints "Error properly closing policy file" on success.
                  bao operator raft snapshot restore -force /work/openbao.snap
                  unset BAO_TOKEN
                  wait_for unsealed

                  # The scratch root token died with the restore; from here on only what the
                  # snapshot itself grants.
                  i=0
                  until BAO_TOKEN=$(bao write -field=token auth/jwt-example/login role=openbao-restore-check \
                    jwt=@/var/run/openbao/token 2>/tmp/login.err); do
                    i=$((i + 1))
                    if [ "$i" -ge 30 ]; then
                      echo "cannot log in to the restored copy:"
                      cat /tmp/login.err
                      exit 1
                    fi
                    sleep 2
                  done
                  export BAO_TOKEN

                  namespaces=$(bao list -format=json sys/namespaces | sed -n 's/^ *"\([^"]*\)\/",\{0,1\} *$/\1/p')
                  [ -n "$namespaces" ] || { echo "the restored copy lists no namespaces"; exit 1; }
                  for ns in $namespaces; do
                    got=$(bao read -namespace="$ns" -field=data kv/data/restore-canary)
                    if [ "$got" != "map[namespace:$ns]" ]; then
                      echo "namespace $ns: restore canary reads '$got'"
                      exit 1
                    fi
                  done
                  bao token revoke -self >/dev/null

                  echo "restore check passed: $(cat /work/key) opened; canaries read, in:" $namespaces
              env:
                - name: BAO_ADDR
                  value: http://127.0.0.1:8200
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: login
                  mountPath: /var/run/openbao
                  readOnly: true
                - name: config
                  mountPath: /etc/restore-check
                  readOnly: true
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: data
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            - name: server-tmp
              emptyDir:
                sizeLimit: 256Mi
            - name: config
              configMap:
                name: openbao-restore-check
            -
              name: login
              projected:
                sources:
                  - serviceAccountToken:
                      audience: openbao
                      expirationSeconds: 600
                      path: token

