                  BAO_TOKEN="$(bao write -field=token auth/jwt-example/login role=openbao-snapshot jwt=@/var/run/openbao/token)"
                  export BAO_TOKEN
                  bao operator raft snapshot save /work/openbao.snap
                  bao token revoke -self
                  mkdir /work/check
                  tar -xzf /work/openbao.snap -C /work/check
                  (cd /work/check && sha256sum -c SHA256SUMS)
                  rm -rf /work/check
                  echo "snapshot $(cat /work/taken-at): $(wc -c < /work/openbao.snap) bytes"
              env:
                - name: BAO_ADDR
                  value: https://openbao-active.openbao.svc:8200
                - name: BAO_CACERT
                  value: /tls/ca.crt
                - name: HOME
                  value: /work
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: login
                  mountPath: /var/run/openbao
                  readOnly: true
                - name: ca
                  mountPath: /tls
                  readOnly: true
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: upload
              image: amazon/aws-cli:2.36.44
              command:
                - /bin/sh
                - -ec
                - |
                  printf '[default]\ns3 =\n  addressing_style = path\n' > /tmp/aws-config
                  key="weekly/$(cat /work/taken-at).snap"
                  aws s3 cp /work/openbao.snap "s3://example-openbao-backups/${key}" --checksum-algorithm SHA256 --no-progress
              env:
                - name: AWS_REGION
                  value: example
                - name: AWS_ENDPOINT_URL_S3
                  value: "https://objects.example.internal"
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
                - name: AWS_CONFIG_FILE
                  value: /tmp/aws-config
                - name: HOME
                  value: /tmp
              envFrom:
                - secretRef:
                    name: openbao-backup-keys
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            -
              name: login
              projected:
                sources:
                  - serviceAccountToken:
                      audience: openbao
                      expirationSeconds: 600
                      path: token
            - name: ca
              secret:
                secretName: openbao-tls
                items:
                  - key: ca.crt
                    path: ca.crt
