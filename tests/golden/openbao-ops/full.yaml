# Source: openbao-ops/templates/restore-check.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-restore-check
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-restore-check
    app.kubernetes.io/part-of: openbao
spec:
  schedule: "37 5 * * 0"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-restore-check
        spec:
          serviceAccountName: openbao-restore-check
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: fetch
              image: "amazon/aws-cli:2.32.7"
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  newest=$(aws s3api list-objects-v2 \
                    --bucket example-openbao-backups --prefix raft/ \
                    --query 'sort_by(Contents,&LastModified)[-1].[Key,LastModified]' \
                    --output text)
                  set -- $newest
                  key=$1
                  age=$(( $(date +%s) - $(date -d "$2" +%s) ))
                  echo "newest snapshot: $key, $((age/60)) minutes old"

                  # A stale newest object means the snapshot job stopped and
                  # nobody noticed. That is the failure this check exists to
                  # find, so it fails here rather than passing on old data.
                  if [ "$age" -gt 43200 ]; then
                    echo "no snapshot within 43200s: the snapshot job is not running" >&2
                    exit 1
                  fi

                  aws s3 cp "s3://example-openbao-backups/$key" /work/openbao.snap --no-progress
                  echo "$key" > /work/key
              env:
                - name: MAX_SNAPSHOT_AGE_SECONDS
                  value: "43200"
                - name: HOME
                  value: /tmp
                - name: AWS_REGION
                  value: "eu-example-1"
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
            - name: server
              restartPolicy: Always
              image: "openbao/openbao:2.6.2"
              imagePullPolicy: IfNotPresent
              command: ["bao", "server", "-config=/etc/openbao/scratch.hcl"]
              volumeMounts:
                - name: config
                  mountPath: /etc/openbao
                  readOnly: true
                - name: data
                  mountPath: /data
                - name: server-tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: check
              image: "openbao/openbao:2.6.2"
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  # `bao status` exits 0 unsealed, 2 sealed or uninitialised,
                  # 1 unreachable. Waiting on the right one of those is the
                  # difference between a flaky check and a real one.
                  wait_for() {
                    want=$1
                    i=0
                    while [ $i -lt 90 ]; do
                      bao status >/dev/null 2>&1 && return 0
                      rc=$?
                      [ "$want" = any ] && [ "$rc" = 2 ] && return 0
                      i=$((i+1))
                      sleep 2
                    done
                    echo "timed out waiting for the scratch server ($want)" >&2
                    exit 1
                  }

                  wait_for any

                  # Throwaway recovery shares: this server exists for the
                  # next ninety seconds and its keys are never printed.
                  BAO_TOKEN=$(bao operator init -recovery-shares=1 -recovery-threshold=1 -format=json \
                    | sed -n 's/.*"root_token"[^"]*"\([^"]*\)".*/\1/p')
                  [ -n "$BAO_TOKEN" ] || { echo "scratch init produced no token" >&2; exit 1; }
                  export BAO_TOKEN
                  wait_for unsealed

                  # -force: the snapshot carries production's own keyring.
                  # Judge by exit code — 2.x prints a spurious "Error
                  # properly closing policy file" on success.
                  bao operator raft snapshot restore -force /work/openbao.snap

                  # The scratch root token died with the restore. From here
                  # the only way in is what the SNAPSHOT grants, which is
                  # the point: this proves the restored copy is usable, not
                  # that a fresh server is.
                  unset BAO_TOKEN
                  wait_for unsealed

                  i=0
                  while [ $i -lt 30 ]; do
                    BAO_TOKEN=$(bao write -field=token \
                      auth/jwt-example/login \
                      role=openbao-restore-check \
                      jwt=@/var/run/openbao/token 2>/dev/null) && break
                    i=$((i+1))
                    sleep 2
                  done
                  [ -n "${BAO_TOKEN:-}" ] || { echo "cannot log in to the restored copy" >&2; exit 1; }
                  export BAO_TOKEN

                  # A canary read per namespace: the restore is judged on
                  # data being there, not on the process exiting zero.
                  got=$(bao read -namespace=devel -field=data kv/data/restore-canary)
                  echo "canary devel: $got"
                  [ -n "$got" ] || { echo "canary missing in devel" >&2; exit 1; }
                  got=$(bao read -namespace=prod -field=data kv/data/restore-canary)
                  echo "canary prod: $got"
                  [ -n "$got" ] || { echo "canary missing in prod" >&2; exit 1; }

                  bao token revoke -self
                  echo "restore check passed: $(cat /work/key)"
              env:
                - name: BAO_ADDR
                  value: http://127.0.0.1:8200
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: login
                  mountPath: /var/run/openbao
                  readOnly: true
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: data
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            - name: server-tmp
              emptyDir:
                sizeLimit: 256Mi
            - name: config
              configMap:
                name: openbao-restore-check
            -
              name: login
              projected:
                sources:
                  - serviceAccountToken:
                      audience: "openbao"
                      expirationSeconds: 600
                      path: token

