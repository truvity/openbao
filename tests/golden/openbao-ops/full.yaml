      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-snapshot
        spec:
          serviceAccountName: openbao-snapshot
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            example.com/pool: batch
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: snapshot
              image: openbao/openbao:2.6.2
              command:
                - /bin/sh
                - -ec
                - |
                  date -u +%Y%m%dT%H%M%SZ > /work/taken-at
                  BAO_TOKEN="$(bao write -field=token auth/jwt-example/login role=openbao-snapshot jwt=@/var/run/openbao/token)"
                  export BAO_TOKEN
                  bao operator raft snapshot save /work/openbao.snap
                  bao token revoke -self
                  mkdir /work/check
                  tar -xzf /work/openbao.snap -C /work/check
                  (cd /work/check && sha256sum -c SHA256SUMS)
                  rm -rf /work/check
                  echo "snapshot $(cat /work/taken-at): $(wc -c < /work/openbao.snap) bytes"
              env:
                - name: BAO_ADDR
                  value: https://openbao-active.openbao.svc:8200
                - name: BAO_CACERT
                  value: /tls/ca.crt
                - name: HOME
                  value: /work
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: login
                  mountPath: /var/run/openbao
                  readOnly: true
                - name: ca
                  mountPath: /tls
                  readOnly: true
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: upload
              image: amazon/aws-cli:2.36.44
              command:
                - /bin/sh
                - -ec
                - |
                  key="weekly/$(cat /work/taken-at).snap"
                  aws s3 cp /work/openbao.snap "s3://example-openbao-backups/${key}" --checksum-algorithm SHA256 --no-progress
              env:
                - name: AWS_REGION
                  value: eu-example-1
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            -
              name: login
              projected:
                sources:
                  - serviceAccountToken:
                      audience: openbao
                      expirationSeconds: 600
                      path: token
            - name: ca
              secret:
                secretName: openbao-tls
                items:
                  - key: ca.crt
                    path: ca.crt

---
# Source: openbao-ops/templates/certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
  namespace: openbao
  annotations:
    example.com/owner: platform
spec:
  secretName: openbao-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: example-ca
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  commonName: "openbao.example.internal"
  dnsNames:
    - "openbao.example.internal"
    - "openbao"
    - "openbao.openbao.svc"
    - "openbao-active"
    - "openbao-active.openbao.svc"
    - "*.openbao-internal"
    - "*.openbao-internal.openbao.svc"
  ipAddresses:
    - 127.0.0.1

---
# Source: openbao-ops/templates/networkpolicy.yaml
apiVersion: networking.example.com/v1alpha1
kind: HostNetworkPolicy
metadata:
  name: openbao-snapshot-egress
  namespace: openbao
  annotations:
    example.com/owner: platform
    example.com/sync-wave: "15"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao-snapshot
  policyTypes:
    - Egress
  egress:
    - ports:
      - port: 443
        protocol: TCP
      to:
      - domainNames:
        - objects.example.internal
