metadata:
  name: openbao-ingress
  namespace: openbao
  annotations:
    example.com/owner: platform
    example.com/sync-wave: "15"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 8200
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              component: server
      ports:
        - port: 8200
          protocol: TCP
        - port: 8201
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao-snapshot
      ports:
        - port: 8200
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao-root-generation
      ports:
        - port: 8200
          protocol: TCP

