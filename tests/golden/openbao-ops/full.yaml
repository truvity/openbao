# Source: openbao-ops/templates/restore-check.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-restore-check
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-restore-check
    app.kubernetes.io/part-of: openbao
  annotations:
    example.com/owner: platform
    example.com/sync-wave: "80"
spec:
  schedule: "37 5 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-restore-check
        spec:
          serviceAccountName: openbao-restore-check
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: fetch
              image: amazon/aws-cli:2.36.44
              command:
                - /bin/sh
                - -ec
                - |
                  newest=$(aws s3api list-objects-v2 --bucket example-openbao-backups --prefix raft/ \
                    --query 'sort_by(Contents, &LastModified)[-1].[Key, LastModified]' --output text)
                  set -- $newest
                  key=$1
                  age=$(( $(date +%s) - $(date -d "$2" +%s) ))
                  echo "newest snapshot: $key, $((age / 60)) minutes old"
                  if [ "$age" -gt 43200 ]; then
                    echo "the newest snapshot is older than 12 hours: the snapshot job is not running"
                    exit 1
                  fi
                  aws s3 cp "s3://example-openbao-backups/$key" /work/openbao.snap --no-progress
                  echo "$key" > /work/key
              env:
                - name: AWS_REGION
                  value: eu-example-1
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
            - name: server
              restartPolicy: Always
              image: openbao/openbao:2.6.2
              command: [bao, server, -config=/etc/openbao/scratch.hcl]
              env:
                - name: AWS_REGION
                  value: eu-example-2
              volumeMounts:
                - name: config
                  mountPath: /etc/openbao
                  readOnly: true
                - name: data
                  mountPath: /data
                - name: server-tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: check
              image: openbao/openbao:2.6.2
              command:
                - /bin/sh
                - -ec
                - |
                  # bao status: 0 unsealed, 2 sealed or uninitialized, 1 unreachable.
                  wait_for() {
                    i=0
                    while [ "$i" -lt 90 ]; do
                      rc=0
                      bao status >/dev/null 2>&1 || rc=$?
                      case "$1:$rc" in any:0|any:2|unsealed:0) return 0 ;; esac
                      i=$((i + 1))
                      sleep 2
                    done
                    echo "the scratch server never became $1 (bao status exit $rc)"
                    bao status || true
                    return 1
                  }

                  wait_for any
                  # Recovery shares of a throwaway install: never printed, gone with the pod.
                  BAO_TOKEN=$(bao operator init -recovery-shares=1 -recovery-threshold=1 -format=json |
                    sed -n 's/^ *"root_token": *"\([^"]*\)".*/\1/p')
                  [ -n "$BAO_TOKEN" ] || { echo "initializing the scratch server returned no root token"; exit 1; }
                  export BAO_TOKEN
                  wait_for unsealed

                  # -force: the snapshot carries production's keyring, not the scratch's.
                  # Judge by exit code; 2.x prints "Error properly closing policy file" on success.
                  bao operator raft snapshot restore -force /work/openbao.snap
                  unset BAO_TOKEN
                  wait_for unsealed

                  # The scratch root token died with the restore; from here on only what the
                  # snapshot itself grants.
                  i=0
                  until BAO_TOKEN=$(bao write -field=token auth/jwt-example/login role=openbao-restore-check \
                    jwt=@/var/run/openbao/token 2>/tmp/login.err); do
                    i=$((i + 1))
                    if [ "$i" -ge 30 ]; then
                      echo "cannot log in to the restored copy:"
                      cat /tmp/login.err
                      exit 1
                    fi
                    sleep 2
                  done
                  export BAO_TOKEN

                  namespaces=$(bao list -format=json sys/namespaces | sed -n 's/^ *"\([^"]*\)\/",\{0,1\} *$/\1/p')
                  [ -n "$namespaces" ] || { echo "the restored copy lists no namespaces"; exit 1; }
                  for ns in $namespaces; do
                    got=$(bao read -namespace="$ns" -field=data kv/data/restore-canary)
                    if [ "$got" != "map[namespace:$ns]" ]; then
                      echo "namespace $ns: restore canary reads '$got'"
                      exit 1
                    fi
                  done

                  verify_link() {
                    possible_issuer=$1
                    possible_issued=$2
                    result=$(bao pki verify-sign -format=json "$possible_issuer" "$possible_issued")
                    for field in signature_match path_match key_id_match subject_match trust_match; do
                      echo "$result" | grep -Eq "\"$field\": *true" || {
                        echo "$possible_issuer did not validate $possible_issued ($field): $result"
                        exit 1
                      }
                    done
                  }

                  # Verify the recovered hierarchies cryptographically. trust_match also
                  # evaluates path length and name constraints in the supplied chain.

                  # The hierarchy, walked from the ROOT YOU TRUST. OpenBAO typically
                  # holds only a nameless, keyless copy of that root (its key is kept
                  # elsewhere), and a walk that ends at whatever the snapshot holds proves
                  # the copy agrees with itself, not that it is ours. So the top is
                  # the committed root certificate, staged in this token's
                  # cubbyhole because verify-sign reads both ends through the API;
                  # path_match on the first link then requires the restored domain
                  # intermediate's ca_chain to carry that exact certificate.
                  anchor=cubbyhole/restore-check/anchor
                  bao write "$anchor" - </etc/restore-check/trust-anchor.json >/dev/null
                  verify_link "$anchor" "$anchor"
                  verify_link "$anchor" pki-example/issuer/example-2026/json
                  for env in devel prod; do
                    verify_link \
                      pki-example/issuer/example-2026/json \
                      "$env/pki/issuer/example-2026-$env/json"
                  done

                  must_refuse() {
                    label=$1
                    shift
                    if bao write -namespace=devel pki/issue/restore-check "$@" >/tmp/invalid-pki.out 2>&1; then
                      echo "the restored fixed-name role accepted $label"
                      cat /tmp/invalid-pki.out
                      exit 1
                    fi
                  }
                  must_refuse wildcard common_name='*.restore-check.devel.example.internal'
                  must_refuse subdomain common_name=child.restore-check.devel.example.internal
                  must_refuse ip-san common_name=restore-check.devel.example.internal ip_sans=127.0.0.1
                  must_refuse uri-san common_name=restore-check.devel.example.internal uri_sans=spiffe://external.invalid/workload
                  must_refuse email-san common_name=restore-check.devel.example.internal alt_names=user@example.com

                  # One leaf per environment from the restore-check role, which
                  # must point at that environment's issuing CA.
                  # verify-sign reads the issued end as certificate plus ca_chain, and
                  # pki/cert/<serial> returns no ca_chain, so the issue response is
                  # staged in the cubbyhole and its data read back as the leaf.
                  for env in devel prod; do
                    leaf=cubbyhole/restore-check/leaf-$env
                    bao write -namespace="$env" -format=json pki/issue/restore-check \
                      common_name="restore-check.$env.example.internal" ttl=1h >/tmp/issued.json
                    bao write cubbyhole/restore-check/issued - </tmp/issued.json >/dev/null
                    bao read -format=json -field=data cubbyhole/restore-check/issued | bao write "$leaf" - >/dev/null
                    rm -f /tmp/issued.json
                    serial=$(bao read -field=serial_number "$leaf")
                    stored=$(bao read -namespace="$env" -field=certificate "pki/cert/$serial" 2>/dev/null) || stored=
                    [ -n "$stored" ] && [ "$stored" = "$(bao read -field=certificate "$leaf")" ] || {
                      echo "the restored $env issuer did not store the leaf it issued (serial '$serial')"
                      exit 1
                    }
                    verify_link "$env/pki/issuer/example-2026-$env/json" "$leaf"
                  done
                  bao token revoke -self >/dev/null

                  echo "restore check passed: $(cat /work/key) opened with the unseal key's eu-example-2 replica; canaries read and the chain verified from example-root-2026 to a fresh leaf, in:" $namespaces
              env:
                - name: BAO_ADDR
                  value: http://127.0.0.1:8200
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: login
                  mountPath: /var/run/openbao
                  readOnly: true
                - name: config
                  mountPath: /etc/restore-check
                  readOnly: true
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: data
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            - name: server-tmp
              emptyDir:
                sizeLimit: 256Mi
            - name: config
              configMap:
                name: openbao-restore-check
            -
              name: login
              projected:
                sources:
                  - serviceAccountToken:
                      audience: openbao
                      expirationSeconds: 600
                      path: token

