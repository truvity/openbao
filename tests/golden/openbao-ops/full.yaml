# Source: openbao-ops/templates/root-generation.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-root-generation
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-root-generation
    app.kubernetes.io/part-of: openbao
  annotations:
    example.com/owner: platform
    example.com/sync-wave: "80"
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-root-generation
        spec:
          serviceAccountName: openbao-root-generation
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            example.com/pool: batch
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: read
              image: openbao/openbao:2.6.2
              command:
                - /bin/sh
                - -ec
                - |
                  : > /work/alert
                  cluster='example-cluster'
                  mount='jwt-example'
                  role='openbao-root-generation'

                  # Nothing below exits non-zero: the alert container is
                  # the only thing that tells anyone, and it never runs if
                  # this one fails the pod.
                  blind() {
                    {
                      echo "${cluster:+$cluster: }the root-token watch cannot see OpenBAO"
                      echo "$1: $(head -c 300 /work/why 2>/dev/null)"
                      echo "This watch reads sys/generate-root-token/attempt as the role $role through the $mount mount, and it can no longer do so. Taking that away is a step someone would take before generating a root token, so it is reported as loudly as an attempt itself — and it is equally what a sealed or unreachable server looks like."
                      echo "Look at: kubectl -n openbao get pods -l app.kubernetes.io/name=openbao,component=server; bao status; bao read auth/$mount/role/$role; bao policy read <the policy bound to it>."
                      echo "The way back: restore the role and its policy — read on sys/generate-root-token/attempt and nothing else — from the configuration that owns them, and re-run this job."
                    } > /work/alert
                    cat /work/alert
                    exit 0
                  }

                  if ! bao write -field=token "auth/$mount/login" \
                       "role=$role" jwt=@/var/run/openbao/token \
                       > /work/token 2> /work/why; then
                    blind "logging in failed"
                  fi
                  BAO_TOKEN="$(cat /work/token)"
                  export BAO_TOKEN
                  rm -f /work/token

                  if ! bao read -field=started sys/generate-root-token/attempt \
                       > /work/started 2> /work/why; then
                    blind "reading sys/generate-root-token/attempt failed"
                  fi

                  if [ "$(cat /work/started)" != "true" ]; then
                    echo "no root-token generation in progress"
                    bao token revoke -self || true
                    exit 0
                  fi

                  progress=$(bao read -field=progress sys/generate-root-token/attempt || echo "?")
                  required=$(bao read -field=required sys/generate-root-token/attempt || echo "?")
                  nonce=$(bao read -field=nonce sys/generate-root-token/attempt || echo "?")
                  bao token revoke -self || true

                  {
                    echo "${cluster:+$cluster: }a root token is being generated in OpenBAO"
                    echo "sys/generate-root-token/attempt reports started=true, $progress of $required key shares given, nonce $nonce. A root token is bound by no policy and expires on no schedule, and generating one needs a quorum of the recovery-key holders — so unless this is a ceremony you are in the room for, the recovery shares are being used by someone who should not have them."
                    echo "Look at: bao operator generate-root -status; the audit device on the server pods (kubectl -n openbao logs -l app.kubernetes.io/name=openbao,component=server --tail=200 | grep generate-root) for who asked and from where."
                    echo "The way back: cancel it — bao operator generate-root -cancel — which invalidates the shares already given and this nonce. If it completed before you got here, revoke the token it produced (bao token revoke <token>, or list auth/token/accessors), then rotate the recovery key so the shares that were used are worth nothing."
                  } > /work/alert
                  cat /work/alert
              env:
                - name: BAO_ADDR
                  value: https://openbao-active.openbao.svc:8200
                - name: BAO_CACERT
                  value: /tls/ca.crt
                - name: HOME
                  value: /work
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: login
                  mountPath: /var/run/openbao
                  readOnly: true
                - name: ca
                  mountPath: /tls
                  readOnly: true
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: alert
              image: amazon/aws-cli:2.36.44
              command:
                - /bin/sh
                - -ec
                - |
                  if [ ! -s /work/alert ]; then
                    echo "rootGeneration: nothing to report"
                    exit 0
                  fi
                  cat /work/alert
                  cp /work/alert /tmp/message
                  printf '\n%s\n' "$OPENBAO_RUNBOOK" >> /tmp/message
                  aws sns publish --topic-arn 'example-topic' \
                    --subject "$(sed -n 1p /work/alert | cut -c1-99)" \
                    --message file:///tmp/message
                  exit 1
              env:
                - name: AWS_REGION
                  value: eu-example-1
                - name: HOME
                  value: /tmp
                - name: OPENBAO_RUNBOOK
                  value: "The way back is `bao operator generate-root -cancel`."
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 1Mi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            -
              name: login
              projected:
                sources:
                  - serviceAccountToken:
                      audience: openbao
                      expirationSeconds: 600
                      path: token
            - name: ca
              secret:
                secretName: openbao-tls
                items:
                  - key: ca.crt
                    path: ca.crt

