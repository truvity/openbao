apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot-age
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-snapshot-age
    app.kubernetes.io/part-of: openbao
  annotations:
    example.com/owner: platform
    example.com/sync-wave: "80"
spec:
  schedule: "13 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-snapshot-age
        spec:
          serviceAccountName: openbao-snapshot-age
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            example.com/pool: batch
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: list-primary
              image: amazon/aws-cli:2.36.44
              command:
                - /bin/sh
                - -ec
                - |
                  mkdir -p /work/newest /work/error
                  if aws s3api list-objects-v2 \
                       --bucket 'example-openbao-backups' \
                       --prefix "$SNAPSHOT_PREFIX" \
                       --query 'Contents[-1].Key' --output text \
                       > /work/answer 2> /work/why; then
                    key=$(cat /work/answer)
                    if [ "$key" = "None" ]; then key=""; fi
                    printf '%s' "$key" > "/work/newest/$STORE_NAME"
                  else
                    : > "/work/newest/$STORE_NAME"
                    head -c 400 /work/why > "/work/error/$STORE_NAME"
                  fi
                  echo "$STORE_NAME: $(cat "/work/newest/$STORE_NAME")$(cat "/work/error/$STORE_NAME" 2>/dev/null)"
              env:
                - name: AWS_REGION
                  value: eu-example-1
                - name: SNAPSHOT_PREFIX
                  value: "raft/"
                - name: STORE_NAME
                  value: "primary"
                - name: HOME
                  value: /work
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
            - name: list-replica
              image: amazon/aws-cli:2.36.44
              command:
                - /bin/sh
                - -ec
                - |
                  mkdir -p /work/newest /work/error
                  if aws s3api list-objects-v2 \
                       --bucket 'example-openbao-backups-replica' \
                       --prefix "$SNAPSHOT_PREFIX" \
                       --query 'Contents[-1].Key' --output text \
                       > /work/answer 2> /work/why; then
                    key=$(cat /work/answer)
                    if [ "$key" = "None" ]; then key=""; fi
                    printf '%s' "$key" > "/work/newest/$STORE_NAME"
                  else
                    : > "/work/newest/$STORE_NAME"
                    head -c 400 /work/why > "/work/error/$STORE_NAME"
                  fi
                  echo "$STORE_NAME: $(cat "/work/newest/$STORE_NAME")$(cat "/work/error/$STORE_NAME" 2>/dev/null)"
              env:
                - name: AWS_REGION
                  value: eu-example-2
                - name: SNAPSHOT_PREFIX
                  value: "raft/"
                - name: STORE_NAME
                  value: "replica"
                - name: HOME
                  value: /work
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
            - name: check
              image: amazon/aws-cli:2.36.44
              command:
                - /bin/sh
                - -ec
                - |
                  now=$(date -u +%s)
                  : > /work/alert
                  : > /work/report
                  problems=0
                  cluster='example-cluster'

                  # <taken-at> is `date -u +%Y%m%dT%H%M%SZ`, the name the
                  # upload contract gives an object. Hand `date` the form
                  # every implementation of it parses: busybox's does not
                  # read the basic ISO form.
                  taken_at() {
                    case "$1" in
                      ????????T??????Z) ;;
                      *) return 1 ;;
                    esac
                    date -u -d "$(echo "$1" | cut -c1-4)-$(echo "$1" | cut -c5-6)-$(echo "$1" | cut -c7-8) $(echo "$1" | cut -c10-11):$(echo "$1" | cut -c12-13):$(echo "$1" | cut -c14-15)" +%s 2>/dev/null
                  }

                  # A span in the unit a reader would use: minutes under an
                  # hour, hours above. "under the 0h limit" read like an
                  # impossible bar for a thirty-minute limit (INF-865).
                  span() {
                    if [ "$1" -lt 3600 ]; then echo "$(( $1 / 60 ))m"; else echo "$(( $1 / 3600 ))h"; fi
                  }

                  look() {
                    name=$1; prefix=$2; limit=$3; where=$4
                    newest=$(cat "/work/newest/$name" 2>/dev/null || true)
                    why=$(cat "/work/error/$name" 2>/dev/null || true)
                    if [ -n "$why" ]; then
                      echo "  $name ($where) could not be listed: $why" >> /work/report
                      problems=$((problems + 1))
                      return 0
                    fi
                    if [ -z "$newest" ]; then
                      echo "  $name ($where) holds no snapshot at all under $prefix" >> /work/report
                      problems=$((problems + 1))
                      return 0
                    fi
                    stamp=${newest##*/}
                    stamp=${stamp%.snap}
                    taken=$(taken_at "$stamp") || taken=""
                    if [ -z "$taken" ]; then
                      echo "  $name ($where) holds $newest, whose name carries no <taken-at>: nothing here can say how old it is" >> /work/report
                      problems=$((problems + 1))
                      return 0
                    fi
                    age=$((now - taken))
                    if [ "$age" -ge "$limit" ]; then
                      echo "  $name ($where) is $(span "$age") behind: its newest is $newest, and more than $(span "$limit") old" >> /work/report
                      problems=$((problems + 1))
                      return 0
                    fi
                    echo "$name: $newest, $(span "$age") old, under the $(span "$limit") limit"
                  }
                  look 'primary' 'raft/' 43200 'the backup account in the primary region'
                  look 'replica' 'raft/' 50400 'the copy replication keeps in the DR region'

                  if [ "$problems" = 0 ]; then
                    exit 0
                  fi
                  {
                    echo "${cluster:+$cluster: }OpenBAO has no fresh backup in $problems of 2 store(s)"
                    echo "A store with nothing fresh in it is what a restore would actually find, whatever the snapshot job's own status says:"
                    cat /work/report
                    echo "Look at: kubectl -n openbao get cronjob,job -l app.kubernetes.io/part-of=openbao; kubectl -n openbao logs -l app.kubernetes.io/name=openbao-snapshot --tail=50 --all-containers."
                    echo "The way back: take one by hand and read its upload container — kubectl -n openbao create job --from=cronjob/openbao-snapshot openbao-snapshot-now. A store that is behind while another is fresh is a copy that has stopped arriving, not a snapshot that was never taken."
                  } > /work/alert
                  cat /work/alert
              env:
                - name: HOME
                  value: /work
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: alert
              image: amazon/aws-cli:2.36.44
              command:
                - /bin/sh
                - -ec
                - |
                  if [ ! -s /work/alert ]; then
                    echo "snapshotAge: nothing to report"
                    exit 0
                  fi
                  cat /work/alert
                  cp /work/alert /tmp/message
                  printf '\n%s\n' "$OPENBAO_RUNBOOK" >> /tmp/message
                  aws sns publish --topic-arn 'example-topic' \
                    --subject "$(sed -n 1p /work/alert | cut -c1-99)" \
                    --message file:///tmp/message
                  exit 1
              env:
                - name: AWS_REGION
                  value: eu-example-1
                - name: HOME
                  value: /tmp
                - name: OPENBAO_RUNBOOK
                  value: "The way back is the restore runbook."
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 1Mi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi

