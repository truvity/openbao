# Source: openbao-ops/templates/restore-check.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-restore-check
  namespace: openbao
data:
  scratch.hcl: |
    ui = false
    disable_mlock = true
    api_addr     = "http://127.0.0.1:8200"
    cluster_addr = "http://127.0.0.1:8201"

    listener "tcp" {
      address     = "127.0.0.1:8200"
      tls_disable = true
    }

    storage "raft" {
      path    = "/data"
      node_id = "restore-check"
    }
    seal "awskms" {
      region     = "eu-example-1"
      kms_key_id = "alias/openbao-unseal"
    }
    
    # Declared, not created through the API: OpenBAO refuses API-created
    # audit devices, so a restored copy with no device in its config would
    # have an audit table production does not have.
    audit "file" "to-stdout" {
      options {
        file_path = "stdout"
      }
    }

