---
# Source: openbao-ops/templates/certificate-expiry.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-tls-expiry
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-tls-expiry
    app.kubernetes.io/part-of: openbao
spec:
  schedule: "23 7 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-tls-expiry
        spec:
          serviceAccountName: openbao-tls-expiry
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: read
              image: alpine/kubectl:1.34.2
              command:
                - /bin/sh
                - -ec
                - |
                  kubectl -n openbao get certificate openbao-serving \
                    -o jsonpath='{.status.notAfter}{"\n"}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{.status.conditions[?(@.type=="Ready")].message}{"\n"}' \
                    > /work/status
                  cat /work/status
              env:
                - name: HOME
                  value: /work
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                limits:
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: alert
              image: registry.example.internal/pager:2.0.0
              command:
                - /usr/local/bin/page-if-expiring
              env:
                - name: ALERT_BEFORE_SECONDS
                  value: "604800"
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 1Mi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi

