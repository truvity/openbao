# Source: openbao-ops/templates/job-success.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-job-success
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-job-success
    app.kubernetes.io/part-of: openbao
spec:
  schedule: "43 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-job-success
        spec:
          serviceAccountName: openbao-job-success
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: read
              image: alpine/kubectl:1.34.2
              command:
                - /bin/sh
                - -ec
                - |
                  now=$(date -u +%s)
                  : > /work/alert
                  : > /work/report
                  problems=0

                  look() {
                    name=$1; limit=$2; what=$3
                    if ! kubectl -n openbao get cronjob "$name" \
                         -o jsonpath='{.spec.suspend}{"\n"}{.status.lastSuccessfulTime}{"\n"}' \
                         > /work/answer 2> /work/why; then
                      echo "  $name ($what) could not be read: $(head -c 300 /work/why). A job that is not there is not running." >> /work/report
                      problems=$((problems + 1))
                      return 0
                    fi
                    suspended=$(sed -n 1p /work/answer)
                    last=$(sed -n 2p /work/answer)
                    if [ "$suspended" = "true" ]; then
                      echo "  $name ($what) is SUSPENDED: spec.suspend is true, so it will not run again until someone unsets it." >> /work/report
                      problems=$((problems + 1))
                      return 0
                    fi
                    if [ -z "$last" ]; then
                      echo "  $name ($what) has never recorded a successful run." >> /work/report
                      problems=$((problems + 1))
                      return 0
                    fi
                    # busybox's date does not read RFC 3339: hand it the
                    # form it parses.
                    when=$(date -u -d "$(echo "$last" | sed -e 's/T/ /' -e 's/Z$//')" +%s 2>/dev/null) || when=""
                    if [ -z "$when" ]; then
                      echo "  $name ($what) reports status.lastSuccessfulTime $last, which is not a time this can read." >> /work/report
                      problems=$((problems + 1))
                      return 0
                    fi
                    age=$((now - when))
                    if [ "$age" -ge "$limit" ]; then
                      echo "  $name ($what) last succeeded $((age / 3600))h ago, at $last; more than the $((limit / 3600))h it is allowed." >> /work/report
                      problems=$((problems + 1))
                      return 0
                    fi
                    echo "$name: last succeeded $((age / 3600))h ago, under the $((limit / 3600))h limit"
                  }
                  look "openbao-restore-check" 777600 "the weekly restore that proves a snapshot still opens"

                  if [ "$problems" = 0 ]; then
                    exit 0
                  fi
                  {
                    echo "example-cluster: $problems of 1 OpenBAO job(s) have not succeeded lately"
                    echo "These are the jobs an install is judged on when it fails, and none of them is loud when it simply stops:"
                    cat /work/report
                    echo "Look at: kubectl -n openbao get cronjob; kubectl -n openbao get job --sort-by=.metadata.creationTimestamp; kubectl -n openbao logs job/<the newest one> --all-containers."
                    echo "The way back: run it by hand and read it — kubectl -n openbao create job --from=cronjob/<name> <name>-now. If it was suspended on purpose, unsuspend it or take it off jobSuccess.cronJobs; a watch nobody can silence is a watch everybody ignores."
                  } > /work/alert
                  cat /work/alert
              env:
                - name: HOME
                  value: /work
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                limits:
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: alert
              image: curlimages/curl:8.22.0
              command:
                - /bin/sh
                - -ec
                - |
                  if [ ! -s /work/alert ]; then
                    echo "jobSuccess: nothing to report"
                    exit 0
                  fi
                  cat /work/alert
                  summary=$(sed -n 1p /work/alert)
                  description=$(sed -n '2,$p' /work/alert | tr '\n\t' '  ')
                  escape() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'; }
                  cat > /tmp/alert.json <<JSON
                  [
                    {
                      "labels": {
                        "alertname": "OpenBAOJobNotSucceeding",
                        "severity": "critical",
                        "release": "openbao"
                      },
                      "annotations": {
                        "summary": "$(escape "$summary")",
                        "description": "$(escape "$description")"
                      }
                    }
                  ]
                  JSON
                  curl --silent --show-error --fail --max-time 30 \
                    --header 'Content-Type: application/json' \
                    --data-binary @/tmp/alert.json \
                    "http://alertmanager.example.svc:9093/api/v2/alerts"
                  exit 1
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 1Mi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi

