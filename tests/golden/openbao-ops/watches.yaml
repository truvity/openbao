# Source: openbao-ops/templates/snapshot-age.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot-age
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-snapshot-age
    app.kubernetes.io/part-of: openbao
spec:
  schedule: "*/30 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-snapshot-age
        spec:
          serviceAccountName: openbao-snapshot-age
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: list-primary
              image: objects.example.internal/tools/store-client:3.1.0
              command:
                - /usr/local/bin/newest-object
              args:
                - --quiet
              env:
                - name: SNAPSHOT_PREFIX
                  value: "raft/"
                - name: STORE_NAME
                  value: "primary"
                - name: HOME
                  value: /work
                - name: OBJECT_STORE
                  value: objects.example.internal
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
            - name: check
              image: amazon/aws-cli:2.36.44
              command:
                - /bin/sh
                - -ec
                - |
                  now=$(date -u +%s)
                  : > /work/alert
                  : > /work/report
                  problems=0

                  # <taken-at> is `date -u +%Y%m%dT%H%M%SZ`, the name the
                  # upload contract gives an object. Hand `date` the form
                  # every implementation of it parses: busybox's does not
                  # read the basic ISO form.
                  taken_at() {
                    case "$1" in
                      ????????T??????Z) ;;
                      *) return 1 ;;
                    esac
                    date -u -d "$(echo "$1" | cut -c1-4)-$(echo "$1" | cut -c5-6)-$(echo "$1" | cut -c7-8) $(echo "$1" | cut -c10-11):$(echo "$1" | cut -c12-13):$(echo "$1" | cut -c14-15)" +%s 2>/dev/null
                  }

                  look() {
                    name=$1; prefix=$2; limit=$3; where=$4
                    newest=$(cat "/work/newest/$name" 2>/dev/null || true)
                    why=$(cat "/work/error/$name" 2>/dev/null || true)
                    if [ -n "$why" ]; then
                      echo "  $name ($where) could not be listed: $why" >> /work/report
                      problems=$((problems + 1))
                      return 0
                    fi
                    if [ -z "$newest" ]; then
                      echo "  $name ($where) holds no snapshot at all under $prefix" >> /work/report
                      problems=$((problems + 1))
                      return 0
                    fi
                    stamp=${newest##*/}
                    stamp=${stamp%.snap}
                    taken=$(taken_at "$stamp") || taken=""
                    if [ -z "$taken" ]; then
                      echo "  $name ($where) holds $newest, whose name carries no <taken-at>: nothing here can say how old it is" >> /work/report
                      problems=$((problems + 1))
                      return 0
                    fi
                    age=$((now - taken))
                    if [ "$age" -ge "$limit" ]; then
                      echo "  $name ($where) is $((age / 3600))h behind: its newest is $newest, and more than $((limit / 3600))h old" >> /work/report
                      problems=$((problems + 1))
                      return 0
                    fi
                    echo "$name: $newest, $((age / 3600))h old, under the $((limit / 3600))h limit"
                  }
                  look "primary" "raft/" 43200 "the object store the snapshots are written to"

                  if [ "$problems" = 0 ]; then
                    exit 0
                  fi
                  {
                    echo "example-cluster: OpenBAO has no fresh backup in $problems of 1 store(s)"
                    echo "A store with nothing fresh in it is what a restore would actually find, whatever the snapshot job's own status says:"
                    cat /work/report
                    echo "Look at: kubectl -n openbao get cronjob,job -l app.kubernetes.io/part-of=openbao; kubectl -n openbao logs -l app.kubernetes.io/name=openbao-snapshot --tail=50 --all-containers."
                    echo "The way back: take one by hand and read its upload container. A store that is behind while another is fresh is a copy that has stopped arriving, not a snapshot that was never taken."
                  } > /work/alert
                  cat /work/alert
              env:
                - name: HOME
                  value: /work
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: alert
              image: curlimages/curl:8.22.0
              command:
                - /bin/sh
                - -ec
                - |
                  if [ ! -s /work/alert ]; then
                    echo "snapshotAge: nothing to report"
                    exit 0
                  fi
                  cat /work/alert
                  summary=$(sed -n 1p /work/alert)
                  description=$(sed -n '2,$p' /work/alert | tr '\n\t' '  ')
                  escape() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'; }
                  cat > /tmp/alert.json <<JSON
                  [
                    {
                      "labels": {
                        "alertname": "OpenBAOSnapshotStale",
                        "severity": "critical",
                        "release": "openbao"
                      },
                      "annotations": {
                        "summary": "$(escape "$summary")",
                        "description": "$(escape "$description")",
                        "runbook": "The way back is the restore runbook."
                      }
                    }
                  ]
                  JSON
                  curl --silent --show-error --fail --max-time 30 \
                    --header 'Content-Type: application/json' \
                    --data-binary @/tmp/alert.json \
                    "http://alertmanager.example.svc:9093/api/v2/alerts"
                  exit 1
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 1Mi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
