---
# Source: openbao-ops/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-ingress
  namespace: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - port: 8200
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              component: server
      ports:
        - port: 8200
          protocol: TCP
        - port: 8201
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: metrics-agent
      ports:
        - port: 8202
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao-snapshot
      ports:
        - port: 8200
          protocol: TCP

