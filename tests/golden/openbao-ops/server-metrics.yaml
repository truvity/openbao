# Source: openbao-ops/templates/server-metrics.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: openbao-server
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-server
    app.kubernetes.io/part-of: openbao
spec:
  namespaceSelector:
    matchNames:
      - openbao
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  podMetricsEndpoints:
    - port: metrics
      scheme: https
      path: /v1/sys/metrics
      params:
        format:
          - prometheus
      interval: 30s
      scrapeTimeout: 10s
      tlsConfig:
        ca:
          secret:
            name: openbao-tls
            key: ca.crt
        serverName: openbao.example.internal

---
# Source: openbao-ops/templates/server-alerts.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: openbao-ops-server-alerts
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-server-alerts
    app.kubernetes.io/part-of: openbao
spec:
  groups:
  - name: openbao-server
    rules:
    - alert: OpenBAOSealed
      annotations:
        description: 'OpenBAO pod {{ $labels.pod }} has been sealed since before this
          alert''s window and serves nothing. With auto-unseal it should unseal on start:
          look at the pod''s log for the seal''s error (a KMS permission, an unreachable
          endpoint, a missing plugin binary). Runbook: docs/server.md, "The seal as
          a plugin".'
        summary: OpenBAO pod {{ $labels.pod }} is sealed
      expr: vault_core_unsealed{namespace="openbao",k8s_cluster_name="example"} == 0
      for: 5m
      labels:
        severity: critical
        team: platform
    - alert: OpenBAONoActiveNode
      annotations:
        description: 'No OpenBAO pod reports itself active: no leader is elected, or
          none can be scraped. Every client is failing. Check for a lost Raft quorum
          (kubectl -n openbao get pods; the pods'' log for "election") and for sealed
          pods.'
        summary: OpenBAO has no active node
      expr: (sum(vault_core_active{namespace="openbao",k8s_cluster_name="example"})
        or vector(0)) < 1
      for: 3m
      labels:
        severity: critical
        team: platform
    - alert: OpenBAORaftUnhealthy
      annotations:
        description: 'Autopilot (read from the active node) counts fewer than 3 healthy
          voters, or reports the cluster unhealthy. One more failure may cost quorum.
          See which node: bao operator raft autopilot state (needs a token); then that
          pod''s log and storage.'
        summary: OpenBAO has fewer than 3 healthy Raft voters
      expr: count(vault_autopilot_node_healthy{namespace="openbao",k8s_cluster_name="example"}
        == 1 and on (namespace, pod) vault_core_active{namespace="openbao",k8s_cluster_name="example"}
        == 1) < 3 or min(vault_autopilot_healthy{namespace="openbao",k8s_cluster_name="example"}
        and on (namespace, pod) vault_core_active{namespace="openbao",k8s_cluster_name="example"}
        == 1) < 1
      for: 10m
      labels:
        severity: warning
        team: platform
    - alert: OpenBAORaftCommitLag
      annotations:
        description: Pod {{ $labels.pod }} has applied {{ $value }} fewer Raft log entries
          than the leader for longer than this alert's window. A follower that cannot
          keep up is a slow disk, a network problem between pods, or a node under memory
          pressure; it cannot take over cleanly while it lags.
        summary: OpenBAO pod {{ $labels.pod }} is {{ $value }} Raft log entries behind
          the leader
      expr: vault_raft_storage_follower_applied_index_delta{namespace="openbao",k8s_cluster_name="example"}
        > 500 and on (namespace, pod) vault_core_active{namespace="openbao",k8s_cluster_name="example"}
        == 0
      for: 10m
      labels:
        severity: warning
        team: platform
    - alert: OpenBAOAuditLogFailures
      annotations:
        description: An audit log request or response failed on pod {{ $labels.pod }}.
          OpenBAO refuses the request it cannot audit, so clients see errors and no
          audit trail exists for them. Look at the audit device the pod declares (a
          stdout device fails when the log pipe is blocked) and at the pod's log.
        summary: OpenBAO audit devices are failing on {{ $labels.pod }}
      expr: increase(vault_audit_log_request_failure{namespace="openbao",k8s_cluster_name="example"}[5m])
        > 0 or increase(vault_audit_log_response_failure{namespace="openbao",k8s_cluster_name="example"}[5m])
        > 0
      for: 2m
      labels:
        severity: critical
        team: platform
    - alert: OpenBAOHighRequestLatency
      annotations:
        description: 'The 99th percentile of non-login request handling time on pod
          {{ $labels.pod }} has been above this alert''s threshold for longer than its
          window. Suspects: storage latency (the Raft disk), a burst of large requests,
          an audit device that blocks, or CPU throttling at the pod''s limit.'
        summary: OpenBAO p99 request latency on {{ $labels.pod }} is {{ $value | printf
          "%.0f" }} ms
      expr: vault_core_handle_request{namespace="openbao",k8s_cluster_name="example",quantile="0.99"}
        > 1000
      for: 15m
      labels:
        severity: warning
        team: platform
    - alert: OpenBAOMetricsDown
      annotations:
        description: The scrape of pod {{ $labels.pod }} fails, so its alerts cannot
          fire. The pod is down, its listener's certificate no longer verifies against
          the CA the scrape reads, or the network policy no longer admits the scraper.
        summary: OpenBAO pod {{ $labels.pod }} cannot be scraped
      expr: up{namespace="openbao",k8s_cluster_name="example",job=~".+/openbao-server"}
        == 0
      for: 10m
      labels:
        severity: warning
        team: platform
    - alert: OpenBAOMetricsAbsent
      annotations:
        description: 'No vault_core_unsealed series exists for namespace openbao: every
          OpenBAO alert is blind. The server''s metrics listener (metrics_only and unauthenticated_metrics_access)
          may be off, or nothing scrapes the pods.'
        summary: No OpenBAO metrics are being scraped
      expr: absent(vault_core_unsealed{namespace="openbao",k8s_cluster_name="example"})
      for: 15m
      labels:
        severity: warning
        team: platform
