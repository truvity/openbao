apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-snapshot
    app.kubernetes.io/part-of: openbao
automountServiceAccountToken: false

---
# Source: openbao-ops/templates/snapshot.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-snapshot
    app.kubernetes.io/part-of: openbao
spec:
  schedule: "17 */6 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-snapshot
        spec:
          serviceAccountName: openbao-snapshot
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: snapshot
              image: "openbao/openbao:2.6.2"
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  date -u +%Y%m%dT%H%M%SZ > /work/taken-at

                  BAO_TOKEN=$(bao write -field=token \
                    auth/jwt/login \
                    role=openbao-snapshot \
                    jwt=@/var/run/openbao/token)
                  export BAO_TOKEN

                  bao operator raft snapshot save /work/openbao.snap
                  # The token dies with the step that needed it.
                  bao token revoke -self

                  # The archive carries its own SHA256SUMS. Verify here, so
                  # a truncated or corrupt snapshot never reaches the store
                  # and never counts as a backup.
                  mkdir /work/check
                  tar -xzf /work/openbao.snap -C /work/check
                  (cd /work/check && sha256sum -c SHA256SUMS)
                  rm -rf /work/check

                  echo "snapshot $(cat /work/taken-at): $(wc -c < /work/openbao.snap) bytes"
              env:
                - name: BAO_ADDR
                  value: "https://openbao-active.openbao.svc:8200"
                - name: BAO_CACERT
                  value: /tls/ca.crt
                - name: HOME
                  value: /work
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: login
                  mountPath: /var/run/openbao
                  readOnly: true
                - name: ca
                  mountPath: /tls
                  readOnly: true
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: upload
              image: "amazon/aws-cli:2.32.7"
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  key="raft/$(cat /work/taken-at).snap"
                  aws s3 cp /work/openbao.snap "s3://example-openbao-backups/${key}" \
                    --checksum-algorithm SHA256 --no-progress
              env:
                - name: SNAPSHOT_PREFIX
                  value: "raft/"
                - name: HOME
                  value: /tmp
                - name: AWS_REGION
                  value: "eu-example-1"
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            -
              name: login
              projected:
                sources:
                  - serviceAccountToken:
                      audience: "openbao"
                      expirationSeconds: 600
                      path: token
            - name: ca
              secret:
                secretName: openbao-tls
                items:
                  - key: ca.crt
                    path: ca.crt

