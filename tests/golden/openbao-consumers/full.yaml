---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-issuer
  namespace: cert-manager
  annotations:
    example.com/owner: platform
    example.com/sync-wave: "32"

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-root-2025
  namespace: cert-manager
  annotations:
    example.com/owner: platform
    example.com/sync-wave: "32"
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    b2xkLXJvb3Q=
    -----END CERTIFICATE-----

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-root-2026
  namespace: cert-manager
  annotations:
    example.com/owner: platform
    example.com/sync-wave: "32"
  labels:
    example.com/root-generation: example-root-2026
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    ZXhhbXBsZS1yb290
    -----END CERTIFICATE-----

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-issuer-token
  namespace: cert-manager
  annotations:
    example.com/owner: platform
    example.com/sync-wave: "32"
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["openbao-issuer"]
    verbs: ["create"]

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-issuer-token
  namespace: cert-manager
  annotations:
    example.com/owner: platform
    example.com/sync-wave: "32"
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-issuer-token

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: example-private-ca
  annotations:
    example.com/owner: platform
    example.com/sync-wave: "33"
spec:
  sources:
    - secret:
        key: ca.crt
        name: legacy-internal-ca
    - configMap:
        name: example-root-2025
        key: ca.crt
    - configMap:
        name: example-root-2026
        key: ca.crt
  target:
    configMap:
      key: ca-certificates.crt
    namespaceSelector:
      {}

---
# Source: openbao-consumers/templates/certificates.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-private-smoke
  namespace: cert-manager
  annotations:
    example.com/owner: platform
    example.com/sync-wave: "34"
spec:
  secretName: example-private-smoke-tls
  commonName: "smoke.devel.example.internal"
  dnsNames:
    - "smoke.devel.example.internal"
  duration: 720h
  renewBefore: 240h
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: example-private

---
# Source: openbao-consumers/templates/certificates.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-workload-smoke
  namespace: cert-manager
  annotations:
    example.com/owner: platform
spec:
  secretName: example-workload-smoke-tls
  dnsNames:
    - "workload-smoke.cert-manager.svc"
  duration: 720h
  renewBefore: 240h
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 384
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: example-workload

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: example-private
  annotations:
    example.com/owner: platform
    example.com/sync-wave: "33"
spec:
  vault:
    server: "https://openbao.example.internal:8200"
    namespace: devel
    path: pki/sign/private
    caBundle: "ZXhhbXBsZS1jYQ=="
    auth:
      kubernetes:
        role: example-private
        mountPath: /v1/auth/jwt-devel
        serviceAccountRef:
          name: openbao-issuer

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: example-workload
  annotations:
    example.com/owner: platform
spec:
  vault:
    server: "https://openbao.example.internal:8200"
    namespace: devel
    path: pki/sign/workload
    caBundle: "ZXhhbXBsZS1jYQ=="
    auth:
      kubernetes:
        role: example-private
        mountPath: /v1/auth/jwt-devel
        serviceAccountRef:
          name: openbao-issuer
          audiences:
            - vault://example-private

---
# Source: openbao-consumers/templates/stores.yaml
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: example-app-openbao
  annotations:
    example.com/owner: platform
    example.com/sync-wave: "55"
spec:
  conditions:
    - namespaces:
      - example-app
  provider:
    vault:
      server: "https://openbao.example.internal:8200"
      namespace: "devel"
      path: "kv"
      version: v2
      caBundle: "ZXhhbXBsZS1jYQ=="
      auth:
        jwt:
          path: "jwt-devel"
          role: "example-app"
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: "external-secrets"
              namespace: "external-secrets"
            audiences:
              - "openbao"
            expirationSeconds: 600

