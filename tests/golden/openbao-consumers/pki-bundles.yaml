---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-issuer
  namespace: cert-manager

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-root-2026
  namespace: cert-manager
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    ZXhhbXBsZS1yb290
    -----END CERTIFICATE-----

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-issuer-token
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["openbao-issuer"]
    verbs: ["create"]

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-issuer-token
  namespace: cert-manager
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-issuer-token

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: openbao-private-ca
spec:
  sources:
    - configMap:
        name: example-root-2026
        key: ca.crt
  target:
    configMap:
      key: ca-certificates.crt
    namespaceSelector:
      {}

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: example-identity-ca
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    example.com/sync-wave: "33"
spec:
  sources:
    - inLine: |
        -----BEGIN CERTIFICATE-----
        ZXhhbXBsZS1lbnZpcm9ubWVudC1jYQ==
        -----END CERTIFICATE-----
    - inLine: |
        -----BEGIN CERTIFICATE-----
        ZXhhbXBsZS1pZGVudGl0eS1yb290
        -----END CERTIFICATE-----
  target:
    configMap:
      key: example-identity-ca.pem
    namespaceSelector:
      matchLabels:
        example.com/workload-identity: "true"

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: example-identity-ca-driver
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    example.com/sync-wave: "33"
spec:
  sources:
    - inLine: |
        -----BEGIN CERTIFICATE-----
        ZXhhbXBsZS1lbnZpcm9ubWVudC1jYQ==
        -----END CERTIFICATE-----
    - inLine: |
        -----BEGIN CERTIFICATE-----
        ZXhhbXBsZS1pZGVudGl0eS1yb290
        -----END CERTIFICATE-----
  target:
    configMap:
      key: example-identity-ca.pem
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: example-driver

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: example-private
spec:
  vault:
    server: "https://openbao.example.internal:8200"
    path: pki/sign/private
    caBundle: "ZXhhbXBsZS1jYQ=="
    auth:
      kubernetes:
        role: example-private
        mountPath: /v1/auth/jwt
        serviceAccountRef:
          name: openbao-issuer
