# The approver layer for a namespaced Issuer (selector kind Issuer, one
# namespace), URI SANs, usages and an explicit requester.
server: https://openbao.example.internal:8200
caBundle: ZXhhbXBsZS1jYQ==
pki:
  enabled: true
  trustAnchors:
    - name: example-root-2026
      certificate: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tClpYaGhiWEJzWlMxeWIyOTAKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
  issuers:
    - name: example-team
      kind: Issuer
      signPath: pki-team/sign/team
      role: example-team

certificates:
  - name: example-team-leaf
    dnsNames: [leaf.team.example.internal]
    usages: [server auth, client auth]
    issuerRef: {name: example-team, kind: Issuer, group: cert-manager.io}

approverPolicy:
  enabled: true
  roleName: example-approver-use
  annotations:
    example.com/sync-wave: "32"
  requesters:
    - kind: ServiceAccount
      name: certs
      namespace: platform
  issuers:
    example-team:
      dnsNames: ["*.team.example.internal"]
      uris: ["https://team.example.internal/"]
      usages: [server auth, client auth]
