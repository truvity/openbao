# Stores on AWS Parameter Store, on a cluster whose External Secrets holds
# its own AWS identity (EKS Pod Identity): no OpenBAO server, no caBundle.
# One store per (cluster, grant), each assuming its grant's reader role and
# usable only from the namespaces it names. The admission policy is on by
# default in this mode.
commonAnnotations:
  example.com/owner: platform

aws:
  identity: podIdentity

awsStores:
  - name: example-app-config
    region: eu-example-1
    role: arn:aws:iam::444455556666:role/a-app-config
    annotations:
      example.com/sync-wave: "55"
    conditions:
      - namespaces: [example-app]
  - name: example-app-credentials
    region: eu-example-1
    role: arn:aws:iam::444455556666:role/a-app-credentials
    conditions:
      - namespaceSelector:
          matchLabels:
            example.com/app-credentials: "true"
