# Everything on, in one install: two snapshot tiers, a weekly restore that
# reads canaries back and walks the restored PKI from a committed root, the
# serving certificate's expiry alert, policies that keep the jobs
# unreachable, and a serving certificate with the in-cluster names.
commonAnnotations:
  example.com/owner: platform
auth:
  mountPath: jwt-example
snapshot:
  enabled: true
  annotations:
    example.com/sync-wave: "80"
  serviceAccountAnnotations:
    example.com/role: openbao-snapshot
  nodeSelector:
    example.com/pool: batch
  upload:
    s3:
      enabled: true
      bucket: example-openbao-backups
      region: eu-example-1
restoreCheck:
  enabled: true
  annotations:
    example.com/sync-wave: "80"
  sealConfig: |
    seal "awskms" {
      region     = "eu-example-2"
      kms_key_id = "alias/openbao-unseal"
    }
  sealDescription: the unseal key's eu-example-2 replica
  serverEnv:
    - name: AWS_REGION
      value: eu-example-2
  fetch:
    s3:
      enabled: true
      bucket: example-openbao-backups
      region: eu-example-1
  pki:
    enabled: true
    trustAnchor:
      name: example-root-2026
      certificate: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tClpYaGhiWEJzWlMxeWIyOTAKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
    intermediate:
      mount: pki-example
      issuer: example-2026
    issuing:
      mount: pki
      issuerPrefix: example-2026
    namespaces: [devel, prod]
    domain: example.internal
certificateExpiry:
  enabled: true
  annotations:
    example.com/sync-wave: "80"
  clusterName: example-cluster
  alert:
    sns:
      enabled: true
      topicArn: example-topic
      region: eu-example-1
      runbook: "The way back is the break-glass certificate: see the runbook."
snapshotAge:
  enabled: true
  annotations:
    example.com/sync-wave: "80"
  serviceAccountAnnotations:
    example.com/role: openbao-snapshot-age
  nodeSelector:
    example.com/pool: batch
  clusterName: example-cluster
  # Every 6 hours to the primary, so 12 hours is two missed runs; the copy
  # another region keeps is allowed the same plus what it takes to arrive.
  stores:
    - name: primary
      description: the backup account in the primary region
      prefix: raft/
      maxAgeSeconds: 43200
      s3:
        enabled: true
        bucket: example-openbao-backups
        region: eu-example-1
    - name: replica
      description: the copy replication keeps in the DR region
      prefix: raft/
      maxAgeSeconds: 50400
      s3:
        enabled: true
        bucket: example-openbao-backups-replica
        region: eu-example-2
  alert:
    sns:
      enabled: true
      topicArn: example-topic
      region: eu-example-1
      runbook: "The way back is the restore runbook."
jobSuccess:
  enabled: true
  annotations:
    example.com/sync-wave: "80"
  nodeSelector:
    example.com/pool: batch
  clusterName: example-cluster
  cronJobs:
    - name: openbao-snapshot
      description: the every-6-hours snapshot
      # 12 hours: two missed runs.
      maxAgeSeconds: 43200
    - name: openbao-snapshot-weekly
      description: the weekly copy
      # Nine days: weekly, plus two for a run that starts late.
      maxAgeSeconds: 777600
    - name: openbao-restore-check
      description: the weekly restore that proves a snapshot still opens
      maxAgeSeconds: 777600
  alert:
    sns:
      enabled: true
      topicArn: example-topic
      region: eu-example-1
rootGeneration:
  enabled: true
  annotations:
    example.com/sync-wave: "80"
  nodeSelector:
    example.com/pool: batch
  clusterName: example-cluster
  alert:
    sns:
      enabled: true
      topicArn: example-topic
      region: eu-example-1
      runbook: "The way back is `bao operator generate-root -cancel`."
networkPolicy:
  enabled: true
  annotations:
    example.com/sync-wave: "15"
  clientCidrs: ["10.0.0.0/8"]
  isolated:
    - name: openbao-drill-ingress
      podSelector:
        app.kubernetes.io/name: openbao-drill
  egress:
    enabled: true
    rules:
      - name: openbao-egress
        podSelector:
          app.kubernetes.io/name: openbao
          component: server
        egress:
          - to: [{ipBlock: {cidr: 10.0.0.0/16}}]
            ports: [{port: 443, protocol: TCP}]
      # A CNI extension that names hosts: its own apiVersion and kind.
      - name: openbao-snapshot-egress
        apiVersion: networking.example.com/v1alpha1
        kind: HostNetworkPolicy
        podSelector:
          app.kubernetes.io/name: openbao-snapshot
        egress:
          - to: [{domainNames: [objects.example.internal]}]
            ports: [{port: 443, protocol: TCP}]
serverCertificate:
  enabled: true
  externalDnsName: openbao.example.internal
  issuerRef:
    name: example-ca
    kind: ClusterIssuer
    group: cert-manager.io
