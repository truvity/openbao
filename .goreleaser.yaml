# Tag-triggered release through truvity/ci-workflows release-public.yaml,
# which runs goreleaser and then pushes every chart under charts/ to
# ghcr.io/truvity/charts at the tag's version.
#
# One tag stamps everything: the charts, the Go module (a module needs no
# build step; the tag is its version) and the openbaoctl binaries built
# here. openbaoctl is a binary, not an image: it is run by a person at a
# ceremony, against a KMS key they were granted, and a container adds a
# credential hand-off and nothing else.
version: 2

project_name: openbao

builds:
  - id: openbaoctl
    main: ./cmd/openbaoctl
    binary: openbaoctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: openbaoctl
    ids: [openbaoctl]
    formats: [tar.gz]
    name_template: "openbaoctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"
      - "^test"

release:
  github: {}
  header: |
    ## openbao {{ .Tag }}

    Charts: `oci://ghcr.io/truvity/charts/openbao-ops` and
    `oci://ghcr.io/truvity/charts/openbao-consumers` at `{{ .Version }}`.
    Go module: `go get github.com/truvity/openbao@{{ .Tag }}`.
    CLI: the `openbaoctl` archives below, or
    `go run github.com/truvity/openbao/cmd/openbaoctl@{{ .Tag }} --help`.
