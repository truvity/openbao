server:
  extraContainers:
    - args:
        - |
          port=8200
          health_timeout=300
          attempts=20
          interval=30

          # Never signal bao before it is serving: SIGHUP's default action
          # terminates a process that has not installed its handler yet, which
          # would restart the server container instead of retrying anything.
          waited=0
          while [ "$waited" -lt "$health_timeout" ]; do
            wget -q -T 2 -O /dev/null --no-check-certificate \
              "https://127.0.0.1:$port/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200" 2>/dev/null && break
            waited=$((waited + 5))
            sleep 5
          done

          signal_bao() {
            for p in /proc/[0-9]*; do
              cmd=$(tr '\0' ' ' < "$p/cmdline" 2>/dev/null) || continue
              case "$cmd" in
                "bao server "*) kill -HUP "${p#/proc/}" && echo "plugin-retry: reloaded bao (pid ${p#/proc/})" ;;
              esac
            done
          }

          plugins="/openbao/plugins/auth-aws-v0.1.1"

          attempt=1
          while [ "$attempt" -le "$attempts" ]; do
            missing=0
            for plugin in $plugins; do
              [ -e "$plugin" ] || missing=1
            done
            [ "$missing" -eq 0 ] && break
            echo "plugin-retry: attempt $attempt/$attempts, reloading bao to retry the plugin download"
            signal_bao
            sleep "$interval"
            attempt=$((attempt + 1))
          done

          for plugin in $plugins; do
            if [ -e "$plugin" ]; then
              echo "plugin-retry: $plugin present"
            else
              echo "plugin-retry: giving up after $attempts attempts, $plugin still missing -- a later restart tries again"
            fi
          done

          # Idle rather than exit either way: exiting (0 or not) only earns this
          # container a restart under the pod's own restartPolicy, which would
          # repeat the same wait-then-give-up cycle forever instead of holding the
          # result it already logged.
          while true; do
            sleep 3600
          done
      command:
        - /bin/sh
        - -c
      image: openbao/openbao:2.7.0
      name: plugin-retry
      volumeMounts:
        - mountPath: /openbao/plugins
          name: openbao-plugins
          readOnly: true
  extraInitContainers:
    - args:
        - |
          set -eu
          src=/seal-plugin-src/openbao-plugin-kms-aws
          dst=/openbao/plugins/kms-awskms-v0.1.0

          if [ ! -s "$src" ]; then
            echo "seal-plugin-install: $src is missing or empty -- the image does not carry the plugin binary at its root" >&2
            exit 1
          fi
          echo "9925bd77bb644fbf8a3a479deb39768e5a230e9b2b4eafad18971b54b3b580e2  $src" | sha256sum -c - >/dev/null || { echo "seal-plugin-install: $src does not match the pinned checksum" >&2; exit 1; }

          # Copy beside the destination and rename, so a start interrupted here never
          # leaves a half-written binary under the name the server will execute. The
          # image carries the binary as 0644.
          cp "$src" "$dst.tmp"
          chmod 0555 "$dst.tmp"
          mv -f "$dst.tmp" "$dst"
          echo "seal-plugin-install: installed $dst"
      command:
        - /bin/sh
        - -c
      image: openbao/openbao:2.7.0
      name: seal-plugin-install
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - mountPath: /openbao/plugins
          name: openbao-plugins
        - mountPath: /seal-plugin-src
          name: seal-plugin-src
          readOnly: true
  ha:
    raft:
      config: |
        ui = true
        disable_standby_reads = true
        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file   = "/openbao/userconfig/openbao-tls/tls.crt"
          tls_key_file    = "/openbao/userconfig/openbao-tls/tls.key"
          telemetry {
            unauthenticated_metrics_access = true
          }
        }
        telemetry {
          prometheus_retention_time = "24h"
          disable_hostname          = true
        }
        storage "raft" {
          path = "/openbao/data"
          retry_join {
            leader_api_addr       = "https://openbao-0.openbao-internal:8200"
            leader_ca_cert_file   = "/openbao/userconfig/openbao-tls/ca.crt"
            leader_tls_servername = "openbao.example.internal"
          }
          retry_join {
            leader_api_addr       = "https://openbao-1.openbao-internal:8200"
            leader_ca_cert_file   = "/openbao/userconfig/openbao-tls/ca.crt"
            leader_tls_servername = "openbao.example.internal"
          }
          retry_join {
            leader_api_addr       = "https://openbao-2.openbao-internal:8200"
            leader_ca_cert_file   = "/openbao/userconfig/openbao-tls/ca.crt"
            leader_tls_servername = "openbao.example.internal"
          }
        }
        seal "awskms" {
          region     = "eu-example-1"
          kms_key_id = "alias/openbao-unseal"
        }
        plugin "kms" "awskms" {
          command = "kms-awskms-v0.1.0"
          version = "v0.1.0"
          sha256sum = "9925bd77bb644fbf8a3a479deb39768e5a230e9b2b4eafad18971b54b3b580e2"
        }
        service_registration "kubernetes" {}
        plugin_directory         = "/openbao/plugins"
        plugin_auto_download     = true
        plugin_auto_register     = true
        plugin_download_behavior = "continue"
        plugin "auth" "aws" {
          image       = "ghcr.io/openbao/openbao-plugin-auth-aws"
          version     = "v0.1.1"
          binary_name = "openbao-plugin-auth-aws"
          sha256sum   = "b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0"
        }
        audit "file" "to-stdout" {
          options {
            file_path = "stdout"
          }
        }
  shareProcessNamespace: true
  volumeMounts:
    - mountPath: /openbao/plugins
      name: openbao-plugins
  volumes:
    - emptyDir: {}
      name: openbao-plugins
    - image:
        pullPolicy: IfNotPresent
        reference: ghcr.io/openbao/openbao-plugin-kms-aws@sha256:fe9fb94872048c9474156c044ea8852bb5c2e968fc9304a3725e4d434b488541
      name: seal-plugin-src
