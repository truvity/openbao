# Level 2: level 1 plus the plugin catalog watch, which says when the aws auth
# plugin the SSH host certificates depend on is not the one registered. The
# server preset (examples/org Server) is what registers it.
namespace: openbao
auth:
  mountPath: jwt-hub
serverCertificate:
  enabled: true
  externalDnsName: openbao.example.internal
  issuerRef:
    name: example-ca
    kind: ClusterIssuer
    group: cert-manager.io
certificateExpiry:
  enabled: true
  clusterName: example-cluster
  alert:
    alertmanager:
      enabled: true
      url: http://alertmanager.example.svc:9093
      release: openbao
networkPolicy:
  enabled: true
  clientCidrs: ["10.0.0.0/8"]
snapshot:
  enabled: true
  upload:
    s3:
      enabled: true
      bucket: example-openbao-backups
      region: eu-example-1
restoreCheck:
  enabled: true
  sealConfig: |
    seal "awskms" {
      region     = "eu-example-1"
      kms_key_id = "alias/openbao-unseal"
    }
  fetch:
    s3:
      enabled: true
      bucket: example-openbao-backups
      region: eu-example-1
  canary:
    enabled: true
    namespaces: [dev, prod]
pluginCatalog:
  enabled: true
  clusterName: example-cluster
  plugins:
    - type: auth
      name: aws
      version: v0.1.1
      description: the aws auth method, for SSH host certificates
      oci: true
      declarative: true
  alert:
    alertmanager:
      enabled: true
      url: http://alertmanager.example.svc:9093
      release: openbao
