# Source: openbao-ops/templates/certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
  namespace: openbao
spec:
  secretName: openbao-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: example-ca
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  commonName: "openbao.example.internal"
  dnsNames:
    - "openbao.example.internal"
    - "openbao"
    - "openbao.openbao.svc"
    - "openbao-active"
    - "openbao-active.openbao.svc"
    - "*.openbao-internal"
    - "*.openbao-internal.openbao.svc"
  ipAddresses:
    - 127.0.0.1
