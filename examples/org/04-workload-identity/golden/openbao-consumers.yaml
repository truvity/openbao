---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-issuer
  namespace: cert-manager

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-root-2026
  namespace: cert-manager
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    ZXhhbXBsZS1yb290
    -----END CERTIFICATE-----

---
# Source: openbao-consumers/templates/approver.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbao-consumers-approver-use
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    verbs: ["use"]
    resourceNames:
      - "example-private"

---
# Source: openbao-consumers/templates/approver.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-consumers-approver-use
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbao-consumers-approver-use
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-issuer-token
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["openbao-issuer"]
    verbs: ["create"]

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-issuer-token
  namespace: cert-manager
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-issuer-token

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: openbao-private-ca
spec:
  sources:
    - configMap:
        name: example-root-2026
        key: ca.crt
  target:
    configMap:
      key: ca-certificates.crt
    namespaceSelector:
      {}

---
# Source: openbao-consumers/templates/certificates.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-private-smoke
  namespace: cert-manager
spec:
  secretName: example-private-smoke-tls
  commonName: "smoke.dev.internal.example.org"
  dnsNames:
    - "smoke.dev.internal.example.org"
  duration: 720h
  renewBefore: 240h
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 384
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: example-private

---
# Source: openbao-consumers/templates/approver.yaml
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: example-private
spec:
  selector:
    issuerRef:
      name: "example-private"
      kind: ClusterIssuer
      group: cert-manager.io
  allowed:
    commonName:
      value: "smoke.dev.internal.example.org"
    dnsNames:
      required: true
      values:
        - '*.dev.internal.example.org'
    isCA: false
  constraints:
    minDuration: 1h
    maxDuration: 2160h
    privateKey:
      algorithm: ECDSA
      maxSize: 384
      minSize: 256

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: example-private
spec:
  vault:
    server: "https://openbao.example.internal:8200"
    namespace: dev
    path: pki-internal/sign/server
    caBundle: "ZXhhbXBsZS1jYQ=="
    auth:
      kubernetes:
        role: example-private
        mountPath: /v1/auth/jwt-dev
        serviceAccountRef:
          name: openbao-issuer

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: example-identity
spec:
  vault:
    server: "https://openbao.example.internal:8200"
    namespace: dev
    path: pki-workload/sign/identity
    caBundle: "ZXhhbXBsZS1jYQ=="
    auth:
      kubernetes:
        role: example-identity
        mountPath: /v1/auth/jwt-dev
        serviceAccountRef:
          name: openbao-issuer

---
# Source: openbao-consumers/templates/stores.yaml
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: example-app-openbao
spec:
  conditions:
    - namespaces:
      - example-app
  provider:
    vault:
      server: "https://openbao.example.internal:8200"
      namespace: "dev"
      path: "kv"
      version: v2
      caBundle: "ZXhhbXBsZS1jYQ=="
      auth:
        jwt:
          path: "jwt-dev"
          role: "example-app"
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: "external-secrets"
              namespace: "external-secrets"
            audiences:
              - "openbao"
            expirationSeconds: 600
