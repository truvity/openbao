# Source: openbao-ops/templates/restore-check.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-restore-check
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-restore-check
    app.kubernetes.io/part-of: openbao
data:
  scratch.hcl: |
    ui            = false
    disable_mlock = true
    api_addr      = "http://127.0.0.1:8200"
    cluster_addr  = "http://127.0.0.1:8201"
    listener "tcp" {
      address     = "127.0.0.1:8200"
      tls_disable = true
    }
    storage "raft" {
      path    = "/data"
      node_id = "restore-check"
    }
    seal "awskms" {
      region     = "eu-example-1"
      kms_key_id = "alias/openbao-unseal"
    }
    # As production declares it, so the restored audit table finds its device.
    audit "file" "to-stdout" {
      options {
        file_path = "stdout"
      }
    }
  trust-anchor.json: |
    {"ca_chain":["-----BEGIN CERTIFICATE-----\nZXhhbXBsZS1yb290\n-----END CERTIFICATE-----\n"],"certificate":"-----BEGIN CERTIFICATE-----\nZXhhbXBsZS1yb290\n-----END CERTIFICATE-----\n"}

