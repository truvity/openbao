# Source: openbao-ops/templates/plugin-catalog.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-plugin-catalog
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-plugin-catalog
    app.kubernetes.io/part-of: openbao
spec:
  schedule: "58 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-plugin-catalog
        spec:
          serviceAccountName: openbao-plugin-catalog
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: read
              image: openbao/openbao:2.6.2
              command:
                - /bin/sh
                - -ec
                - |
                  : > /work/alert
                  : > /work/report
                  problems=0
                  cluster='example-cluster'
                  mount='jwt-hub'
                  role='openbao-plugin-catalog'

                  # Nothing below the login exits non-zero: the alert
                  # container is the only thing that tells anyone, and it
                  # never runs if this one fails the pod.
                  blind() {
                    {
                      echo "${cluster:+$cluster: }the plugin-catalog watch cannot see OpenBAO"
                      echo "$1: $(head -c 300 /work/why 2>/dev/null)"
                      echo "This watch logs in as the role $role through the $mount mount to read sys/plugins/catalog/<type>/<name>, and it can no longer do so. Losing that access is a step someone would take before a catalog entry could disappear unnoticed, and it is equally what a sealed or unreachable server looks like."
                      echo "Look at: kubectl -n openbao get pods -l app.kubernetes.io/name=openbao,component=server; bao status; bao read auth/$mount/role/$role; bao policy read <the policy bound to it>."
                      echo "The way back: restore the role and its policy — read AND sudo on sys/plugins/catalog/<type>/<name> for each configured entry, and nothing else — from the configuration that owns them, and re-run this job."
                    } > /work/alert
                    cat /work/alert
                    exit 0
                  }

                  if ! bao write -field=token "auth/$mount/login" \
                       "role=$role" jwt=@/var/run/openbao/token \
                       > /work/token 2> /work/why; then
                    blind "logging in failed"
                  fi
                  BAO_TOKEN="$(cat /work/token)"
                  export BAO_TOKEN
                  rm -f /work/token

                  # Reading one entry does not exit the container: a
                  # single plugin missing, or a policy narrowed to drop
                  # one of several entries, is a problem for the report,
                  # not proof the whole watch has gone blind.
                  look() {
                    type=$1; name=$2; version=$3; want_oci=$4; want_declarative=$5; what=$6
                    if ! bao read "sys/plugins/catalog/$type/$name" "version=$version" \
                         > /work/answer 2> /work/why; then
                      echo "  $type/$name ($what) is not in the catalog at version $version: $(head -c 300 /work/why)" >> /work/report
                      problems=$((problems + 1))
                      return 0
                    fi
                    if [ "$want_oci" = "true" ]; then
                      got=$(bao read -field=oci "sys/plugins/catalog/$type/$name" "version=$version" 2> /work/why) || got="?"
                      if [ "$got" != "true" ]; then
                        echo "  $type/$name ($what) is in the catalog at $version but oci=$got, not true — an API registration, not a declarative download" >> /work/report
                        problems=$((problems + 1))
                        return 0
                      fi
                    fi
                    if [ "$want_declarative" = "true" ]; then
                      got=$(bao read -field=declarative "sys/plugins/catalog/$type/$name" "version=$version" 2> /work/why) || got="?"
                      if [ "$got" != "true" ]; then
                        echo "  $type/$name ($what) is in the catalog at $version but declarative=$got, not true — an API registration, not a declarative download" >> /work/report
                        problems=$((problems + 1))
                        return 0
                      fi
                    fi
                    echo "$type/$name: in the catalog at $version"
                  }
                  look 'auth' 'aws' 'v0.1.1' 'true' 'true' 'the aws auth method, for SSH host certificates'

                  bao token revoke -self || true

                  if [ "$problems" = 0 ]; then
                    exit 0
                  fi
                  {
                    echo "${cluster:+$cluster: }$problems of 1 OpenBAO plugin(s) are not in the catalog as configured"
                    echo "OpenBAO downloads an OCI plugin declaratively at startup, and plugin_download_behavior = \"continue\" lets the server start anyway when that download fails — a mount that uses a missing plugin fails only when something tries to use it, never when the download itself was silently skipped:"
                    cat /work/report
                    echo "Look at: kubectl -n openbao get pods -l app.kubernetes.io/name=openbao,component=server (each pod's own logs for \"failed to download plugin\"); bao read sys/plugins/catalog/<type>/<name>."
                    echo "The way back: canary one standby, confirm the catalog entry there, then roll the rest — docs/server.md's plugin rollout runbook."
                  } > /work/alert
                  cat /work/alert
              env:
                - name: BAO_ADDR
                  value: https://openbao-active.openbao.svc:8200
                - name: BAO_CACERT
                  value: /tls/ca.crt
                - name: HOME
                  value: /work
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: login
                  mountPath: /var/run/openbao
                  readOnly: true
                - name: ca
                  mountPath: /tls
                  readOnly: true
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: alert
              image: curlimages/curl:8.22.0
              command:
                - /bin/sh
                - -ec
                - |
                  if [ ! -s /work/alert ]; then
                    echo "pluginCatalog: nothing to report"
                    exit 0
                  fi
                  cat /work/alert
                  summary=$(sed -n 1p /work/alert)
                  description=$(sed -n '2,$p' /work/alert | tr '\n\t' '  ')
                  escape() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'; }
                  cat > /tmp/alert.json <<JSON
                  [
                    {
                      "labels": {
                        "alertname": "$(escape "$OPENBAO_ALERTNAME")",
                        "severity": "$(escape "$OPENBAO_SEVERITY")",
                        "release": "$(escape "$OPENBAO_RELEASE")"
                      },
                      "annotations": {
                        "summary": "$(escape "$summary")",
                        "description": "$(escape "$description")"
                      }
                    }
                  ]
                  JSON
                  curl --silent --show-error --fail --max-time 30 \
                    --header 'Content-Type: application/json' \
                    --data-binary @/tmp/alert.json \
                    'http://alertmanager.example.svc:9093/api/v2/alerts'
                  exit 1
              env:
                - name: HOME
                  value: /tmp
                - name: OPENBAO_ALERTNAME
                  value: "OpenBAOPluginMissing"
                - name: OPENBAO_SEVERITY
                  value: "critical"
                - name: OPENBAO_RELEASE
                  value: "openbao"
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 10m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 1Mi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            -
              name: login
              projected:
                sources:
                  - serviceAccountToken:
                      audience: openbao
                      expirationSeconds: 600
                      path: token
            - name: ca
              secret:
                secretName: openbao-tls
                items:
                  - key: ca.crt
                    path: ca.crt

