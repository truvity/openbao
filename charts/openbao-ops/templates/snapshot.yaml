{{- if .Values.snapshot.enabled }}
{{- $s := .Values.snapshot }}
{{- $ns := include "ops.namespace" . }}
{{- if not $s.jobs }}
{{- fail "snapshot.jobs is empty — an enabled snapshot that runs on no schedule takes no backups" }}
{{- end }}
{{- $upload := $s.upload }}
{{- if and (not $upload.s3.enabled) (not $upload.command) }}
{{- fail "snapshot.upload needs either s3.enabled or an explicit command — the chart will not invent a place to put your backups" }}
{{- end }}
{{- include "ops.s3Refusals" (dict "part" "snapshot.upload.s3" "s3" $upload.s3) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $s.serviceAccountName }}
  namespace: {{ $ns }}
  labels:
    {{- include "ops.labels" $s.serviceAccountName | nindent 4 }}
  {{- with include "ops.annotations" (dict "root" $ "extra" (mergeOverwrite (deepCopy ($s.annotations | default dict)) ($s.serviceAccountAnnotations | default dict))) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /* The default token is neither audience-scoped nor short-lived. The
       job projects its own instead (see the login volume). */}}
automountServiceAccountToken: false
{{- range $job := $s.jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $job.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "ops.labels" $s.serviceAccountName | nindent 4 }}
  {{- with include "ops.annotations" (dict "root" $ "extra" $s.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ $job.schedule | quote }}
  timeZone: {{ $s.timeZone }}
  {{- /* Two snapshots at once would race for the same object name, and a
         run that starts late is still worth taking. */}}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ $s.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ $s.backoffLimit }}
      activeDeadlineSeconds: {{ $s.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ $s.serviceAccountName }}
        spec:
          serviceAccountName: {{ $s.serviceAccountName }}
          automountServiceAccountToken: false
          restartPolicy: Never
          {{- with $s.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $s.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "ops.podSecurityContext" $ | nindent 12 }}
          {{- /* Taking and VERIFYING the snapshot is an initContainer and
                 uploading is the main container, so nothing can be stored
                 that was not first proven to be a readable archive: the
                 archive carries its own SHA256SUMS over meta.json and
                 state.bin. A backup nobody has opened is a guess. */}}
          initContainers:
            - name: snapshot
              {{- include "ops.imageLines" $s.image | nindent 14 }}
              command:
                - /bin/sh
                - -ec
                - |
                  date -u +%Y%m%dT%H%M%SZ > /work/taken-at
                  BAO_TOKEN="$(bao write -field=token auth/{{ $.Values.auth.mountPath }}/login role={{ $s.baoRole }} jwt=@{{ include "ops.tokenPath" $ }})"
                  export BAO_TOKEN
                  bao operator raft snapshot save /work/openbao.snap
                  bao token revoke -self
                  mkdir /work/check
                  tar -xzf /work/openbao.snap -C /work/check
                  (cd /work/check && sha256sum -c SHA256SUMS)
                  rm -rf /work/check
                  echo "snapshot $(cat /work/taken-at): $(wc -c < /work/openbao.snap) bytes"
              env:
                - name: BAO_ADDR
                  value: {{ include "ops.serverAddress" $ }}
                - name: BAO_CACERT
                  value: /tls/{{ $.Values.server.caKey }}
                {{- with $.Values.server.tlsServerName }}
                {{- /* Dial the active pod, verify the name the serving
                       certificate carries. */}}
                - name: BAO_TLS_SERVER_NAME
                  value: {{ . | quote }}
                {{- end }}
                - name: HOME
                  value: /work
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: login
                  mountPath: {{ $.Values.auth.tokenMountPath }}
                  readOnly: true
                - name: ca
                  mountPath: /tls
                  readOnly: true
              resources:
                {{- toYaml $s.resources | nindent 16 }}
              securityContext:
                {{- include "ops.containerSecurityContext" $ | nindent 16 }}
          containers:
            - name: upload
              {{- include "ops.imageLines" $upload.image | nindent 14 }}
              {{- if $upload.s3.enabled }}
              command:
                - /bin/sh
                - -ec
                - |
                  {{- with include "ops.s3Configure" (dict "s3" $upload.s3 "configFile" "/tmp/aws-config") }}
                  {{ . }}
                  {{- end }}
                  key="{{ $job.prefix }}$(cat /work/taken-at).snap"
                  aws s3 cp /work/openbao.snap "s3://{{ $upload.s3.bucket }}/${key}" --checksum-algorithm {{ $upload.s3.checksumAlgorithm }} --no-progress
              env:
                - name: AWS_REGION
                  value: {{ $upload.s3.region }}
                {{- with include "ops.s3Env" (dict "s3" $upload.s3 "configFile" "/tmp/aws-config") | trim }}
                {{- . | nindent 16 }}
                {{- end }}
                - name: HOME
                  value: /tmp
                {{- with $upload.env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- with $upload.s3.existingSecret }}
              {{- /* A store with no pod identity supplies keys here. envFrom
                     rather than named env so a session token is carried
                     too, without the chart naming every variable the CLI
                     may read. */}}
              envFrom:
                - secretRef:
                    name: {{ . }}
              {{- end }}
              {{- else }}
              {{- /* The contract for a replacement: read /work/openbao.snap
                     and /work/taken-at, store the bytes under
                     $SNAPSHOT_PREFIX<taken-at>.snap. */}}
              command:
                {{- toYaml $upload.command | nindent 16 }}
              {{- with $upload.args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              env:
                - name: SNAPSHOT_PREFIX
                  value: {{ $job.prefix | quote }}
                - name: HOME
                  value: /tmp
                {{- with $upload.env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- end }}
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml $upload.resources | nindent 16 }}
              securityContext:
                {{- include "ops.containerSecurityContext" $ | nindent 16 }}
          volumes:
            - name: work
              emptyDir:
                sizeLimit: {{ $s.workSizeLimit }}
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            - {{- include "ops.loginVolume" $ | nindent 14 }}
            - name: ca
              secret:
                secretName: {{ $.Values.server.tlsSecretName }}
                items:
                  - key: {{ $.Values.server.caKey }}
                    path: {{ $.Values.server.caKey }}
{{- end }}
{{- end }}
