{{- if .Values.snapshot.enabled }}
{{- $s := .Values.snapshot }}
{{- $ns := include "ops.namespace" . }}
{{- if not $s.jobs }}
{{- fail "snapshot.jobs is empty — an enabled snapshot that runs on no schedule takes no backups" }}
{{- end }}
{{- $upload := $s.upload }}
{{- if and (not $upload.s3.enabled) (not $upload.command) }}
{{- fail "snapshot.upload needs either s3.enabled or an explicit command — the chart will not invent a place to put your backups" }}
{{- end }}
{{- if and $upload.s3.enabled (not $upload.s3.bucket) }}
{{- fail "snapshot.upload.s3.bucket is required when the s3 preset is on" }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $s.serviceAccountName }}
  namespace: {{ $ns }}
  {{- with include "ops.annotations" (dict "root" $ "extra" $s.serviceAccountAnnotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ $s.serviceAccountName }}
    app.kubernetes.io/part-of: openbao
{{- /* The default token is neither audience-scoped nor short-lived. The
       job projects its own instead (see the login volume). */}}
automountServiceAccountToken: false
{{- range $job := $s.jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $job.name }}
  namespace: {{ $ns }}
  {{- with include "ops.annotations" (dict "root" $ "extra" $s.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ $s.serviceAccountName }}
    app.kubernetes.io/part-of: openbao
spec:
  schedule: {{ $job.schedule | quote }}
  timeZone: {{ $s.timeZone | quote }}
  {{- /* Two snapshots at once would race for the same object name, and a
         run that starts late is still worth taking. */}}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ $s.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ $s.backoffLimit }}
      activeDeadlineSeconds: {{ $s.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ $s.serviceAccountName }}
        spec:
          serviceAccountName: {{ $s.serviceAccountName }}
          automountServiceAccountToken: false
          restartPolicy: Never
          {{- with $s.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $s.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "ops.podSecurityContext" $ | nindent 12 }}
          {{- /* Taking and VERIFYING the snapshot is an initContainer and
                 uploading is the main container, so nothing can be stored
                 that was not first proven to be a readable archive. A
                 backup nobody has opened is a guess. */}}
          initContainers:
            - name: snapshot
              image: {{ include "ops.image" (dict "image" $s.image) | quote }}
              imagePullPolicy: {{ $s.image.pullPolicy }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  date -u +%Y%m%dT%H%M%SZ > /work/taken-at

                  BAO_TOKEN=$(bao write -field=token \
                    auth/{{ $.Values.auth.mountPath }}/login \
                    role={{ $s.baoRole }} \
                    jwt=@/var/run/openbao/token)
                  export BAO_TOKEN

                  bao operator raft snapshot save /work/openbao.snap
                  # The token dies with the step that needed it.
                  bao token revoke -self

                  # The archive carries its own SHA256SUMS. Verify here, so
                  # a truncated or corrupt snapshot never reaches the store
                  # and never counts as a backup.
                  mkdir /work/check
                  tar -xzf /work/openbao.snap -C /work/check
                  (cd /work/check && sha256sum -c SHA256SUMS)
                  rm -rf /work/check

                  echo "snapshot $(cat /work/taken-at): $(wc -c < /work/openbao.snap) bytes"
              env:
                - name: BAO_ADDR
                  value: {{ include "ops.serverAddress" $ | quote }}
                - name: BAO_CACERT
                  value: /tls/{{ $.Values.server.caKey }}
                - name: HOME
                  value: /work
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: login
                  mountPath: /var/run/openbao
                  readOnly: true
                - name: ca
                  mountPath: /tls
                  readOnly: true
              resources:
                {{- toYaml $s.resources | nindent 16 }}
              securityContext:
                {{- include "ops.containerSecurityContext" $ | nindent 16 }}
          containers:
            - name: upload
              image: {{ include "ops.image" (dict "image" $upload.image) | quote }}
              imagePullPolicy: {{ $upload.image.pullPolicy }}
              {{- if $upload.s3.enabled }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  key="{{ $job.prefix }}$(cat /work/taken-at).snap"
                  aws s3 cp /work/openbao.snap "s3://{{ $upload.s3.bucket }}/${key}" \
                    --checksum-algorithm {{ $upload.s3.checksumAlgorithm }} --no-progress
              {{- else }}
              {{- /* The contract for a replacement: read /work/openbao.snap
                     and /work/taken-at, store it under <prefix><taken-at>.snap. */}}
              command:
                {{- toYaml $upload.command | nindent 16 }}
              {{- with $upload.args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- end }}
              env:
                - name: SNAPSHOT_PREFIX
                  value: {{ $job.prefix | quote }}
                - name: HOME
                  value: /tmp
                {{- if $upload.s3.enabled }}
                - name: AWS_REGION
                  value: {{ $upload.s3.region | quote }}
                {{- end }}
                {{- with $upload.env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml $upload.resources | nindent 16 }}
              securityContext:
                {{- include "ops.containerSecurityContext" $ | nindent 16 }}
          volumes:
            - name: work
              emptyDir:
                sizeLimit: {{ $s.workSizeLimit }}
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            - {{- include "ops.loginVolume" $ | nindent 14 }}
            - name: ca
              secret:
                secretName: {{ $.Values.server.tlsSecretName }}
                items:
                  - key: {{ $.Values.server.caKey }}
                    path: {{ $.Values.server.caKey }}
{{- end }}
{{- end }}
