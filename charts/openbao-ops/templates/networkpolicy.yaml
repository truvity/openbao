{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $ns := include "ops.namespace" . }}
{{- if not $np.clientCidrs }}
{{- fail "networkPolicy.clientCidrs is empty — an ingress policy with no client range admits nobody, which is not what enabling it means" }}
{{- end }}
{{- $isolated := list }}
{{- if $.Values.restoreCheck.enabled }}
{{- $isolated = append $isolated (dict "name" $np.names.restoreCheckIngress "podSelector" (dict "app.kubernetes.io/name" $.Values.restoreCheck.serviceAccountName)) }}
{{- end }}
{{- if $.Values.certificateExpiry.enabled }}
{{- $isolated = append $isolated (dict "name" $np.names.certificateExpiryIngress "podSelector" (dict "app.kubernetes.io/name" $.Values.certificateExpiry.name)) }}
{{- end }}
{{- /* The watches serve nothing either: each one reads something and
       posts one alert. */}}
{{- if $.Values.snapshotAge.enabled }}
{{- $isolated = append $isolated (dict "name" $np.names.snapshotAgeIngress "podSelector" (dict "app.kubernetes.io/name" $.Values.snapshotAge.name)) }}
{{- end }}
{{- if $.Values.jobSuccess.enabled }}
{{- $isolated = append $isolated (dict "name" $np.names.jobSuccessIngress "podSelector" (dict "app.kubernetes.io/name" $.Values.jobSuccess.name)) }}
{{- end }}
{{- if $.Values.rootGeneration.enabled }}
{{- $isolated = append $isolated (dict "name" $np.names.rootGenerationIngress "podSelector" (dict "app.kubernetes.io/name" $.Values.rootGeneration.name)) }}
{{- end }}
{{- range $i := $np.isolated }}
{{- if not (and $i.name $i.podSelector) }}
{{- fail "every entry of networkPolicy.isolated needs a name and a podSelector — an empty selector would isolate every pod in the namespace" }}
{{- end }}
{{- $isolated = append $isolated $i }}
{{- end }}
---
{{- /* Ingress to the server. Two rules, and both matter: clients reach the
       API port only, and peers reach the cluster port only from each
       other — a Raft peer port open to clients is a second, unauthenticated
       way into the same data. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $np.names.serverIngress }}
  namespace: {{ $ns }}
  {{- with include "ops.annotations" (dict "root" $ "extra" $np.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $.Values.server.podLabels | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range $cidr := $np.clientCidrs }}
        - ipBlock:
            cidr: {{ $cidr }}
        {{- end }}
        {{- with $np.extraClientSelectors }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: {{ $.Values.server.apiPort }}
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml $.Values.server.podLabels | nindent 14 }}
      ports:
        - port: {{ $.Values.server.apiPort }}
          protocol: TCP
        - port: {{ $.Values.server.clusterPort }}
          protocol: TCP
    {{- if $.Values.snapshot.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $.Values.snapshot.serviceAccountName }}
      ports:
        - port: {{ $.Values.server.apiPort }}
          protocol: TCP
    {{- end }}
    {{- if $.Values.rootGeneration.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $.Values.rootGeneration.name }}
      ports:
        - port: {{ $.Values.server.apiPort }}
          protocol: TCP
    {{- end }}
{{- range $i := $isolated }}
---
{{- /* Nothing may connect to this pod. The restore check and anything like
       it holds a full plaintext copy of production for the life of one pod;
       the expiry check serves nothing. Not a probe, not a scraper, not
       another job. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $i.name }}
  namespace: {{ $ns }}
  {{- with include "ops.annotations" (dict "root" $ "extra" $np.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $i.podSelector | nindent 6 }}
  policyTypes:
    - Ingress
{{- end }}
{{- if $np.egress.enabled }}
{{- range $rule := $np.egress.rules }}
{{- if not (and $rule.name $rule.podSelector) }}
{{- fail "every entry of networkPolicy.egress.rules needs a name and a podSelector" }}
{{- end }}
---
{{- /* Egress as whole policies. A standard NetworkPolicy is CIDR-based, and
       a policy that names hostnames needs a CNI extension whose shape
       differs by provider — so a rule may set its own apiVersion and kind,
       and its egress entries are passed through as written. */}}
apiVersion: {{ $rule.apiVersion | default "networking.k8s.io/v1" }}
kind: {{ $rule.kind | default "NetworkPolicy" }}
metadata:
  name: {{ $rule.name }}
  namespace: {{ $ns }}
  {{- with include "ops.annotations" (dict "root" $ "extra" $np.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $rule.podSelector | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- toYaml $rule.egress | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
