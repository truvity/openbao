{{- if .Values.serverMetrics.enabled }}
{{- $m := .Values.serverMetrics }}
{{- $pm := $m.podMonitor }}
{{- $ns := include "ops.namespace" . }}
{{- if or (eq (int $m.port) (int $.Values.server.apiPort)) (eq (int $m.port) (int $.Values.server.clusterPort)) }}
{{- fail "serverMetrics.port must differ from server.apiPort and server.clusterPort — the metrics listener is a port of its own, so the scraper can be admitted to it and to nothing else" }}
{{- end }}
{{- if $pm.enabled }}
{{- if not $.Values.server.tlsSecretName }}
{{- fail "serverMetrics.podMonitor needs server.tlsSecretName — the scrape verifies the listener's certificate against the CA in that Secret, and the chart will not turn verification off" }}
{{- end }}
---
{{- /* The server's own metrics, scraped from the metrics listener: a second
       listener on serverMetrics.port that serves /v1/sys/metrics and
       nothing else, without a token (metrics_only and
       unauthenticated_metrics_access; the server preset renders it,
       docs/server.md "Metrics"). It shares the API listener's certificate,
       so the scrape verifies it like any client: the CA comes from the serving certificate's Secret, which
       lives in this namespace because a scrape object reads its Secrets
       from its own. A PodMonitor, portable across a Prometheus-style
       operator and VictoriaMetrics' (which converts it). A converted
       object is NOT updated when this one changes on some operator
       versions: delete the converted VMPodScrape after editing. */}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $pm.name }}
  namespace: {{ $pm.namespace | default $ns }}
  labels:
    {{- include "ops.labels" $pm.name | nindent 4 }}
    {{- with $pm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with include "ops.annotations" (dict "root" $ "extra" $pm.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ $ns }}
  selector:
    matchLabels:
      {{- toYaml $.Values.server.podLabels | nindent 6 }}
  podMetricsEndpoints:
    - port: {{ $pm.port }}
      scheme: https
      path: /v1/sys/metrics
      params:
        format:
          - prometheus
      interval: {{ $pm.interval }}
      scrapeTimeout: {{ $pm.scrapeTimeout }}
      tlsConfig:
        ca:
          secret:
            name: {{ $.Values.server.tlsSecretName }}
            key: {{ $.Values.server.caKey }}
        {{- with $.Values.server.tlsServerName }}
        serverName: {{ . }}
        {{- end }}
{{- end }}
{{- end }}
