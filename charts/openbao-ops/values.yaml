# openbao-ops — the operational half of an OpenBAO install.
#
# The upstream chart (openbao/openbao) installs the server. This one runs
# beside it and owns what an install is actually judged on when it fails:
#
#   snapshot           backups, verified before they are stored — an archive
#                      nobody has opened is a guess, not a backup.
#   restoreCheck       a weekly restore into a throwaway server that reads
#                      the data back and, optionally, walks the restored PKI
#                      from a root you committed. It is the only evidence the
#                      backups work.
#   certificateExpiry  a daily look at the serving certificate's end date,
#                      alerting weeks before a renewal that keeps failing
#                      turns into an outage.
#   networkPolicy      the server reachable from clients and peers, the jobs
#                      from nothing at all.
#   serverCertificate + tlsReload
#                      a serving certificate, and the sidecar that makes a
#                      renewal take effect without a restart.
#
# Every part is off until enabled, so one install can carry any subset —
# including a second install that renders only the certificate, where the
# certificate is owned by a different deployment than the jobs.
#
# Nothing here names a cloud, a bucket, a key or a region. Object storage
# and alerting are containers you supply with a documented contract, and an
# AWS preset (S3, SNS) ships as one implementation of each.

# Added to every object this chart renders. Per-part `annotations` are
# merged over it.
commonAnnotations: {}

# Where the server and these jobs live. Empty: the release namespace.
namespace: ""

server:
  # The API address the jobs talk to. Empty: derived from activeService.
  address: ""
  # The Service that resolves to whichever pod is active. Writes must not
  # land on a standby.
  activeService: openbao-active
  service: openbao
  # The headless Service peers dial each other through.
  headlessService: openbao-internal
  apiPort: 8200
  clusterPort: 8201
  # The Secret holding the serving certificate, and the key inside it that
  # a client uses to verify the server.
  tlsSecretName: openbao-tls
  caKey: ca.crt
  # The name a job verifies the server's certificate against, when that is
  # not the name it dials (BAO_TLS_SERVER_NAME). Set it when the serving
  # certificate names only the external endpoint — for instance because
  # its chain is name-constrained and cannot carry in-cluster names — and
  # the jobs dial the active Service by its cluster name.
  tlsServerName: ""
  # How the server's pods are labelled, for the network policies.
  podLabels:
    app.kubernetes.io/name: openbao
    component: server

auth:
  # The JWT auth mount the jobs log in to.
  mountPath: jwt
  # The audience the mount requires. A token minted for this audience
  # cannot be replayed against the Kubernetes API.
  audience: openbao
  expirationSeconds: 600
  # Where the projected login token is mounted in the jobs' containers.
  tokenMountPath: /var/run/openbao

# ---------------------------------------------------------------------------
snapshot:
  enabled: false
  serviceAccountName: openbao-snapshot
  serviceAccountAnnotations: {}
  annotations: {}
  # The OpenBAO role the job logs in as. It should be able to read
  # sys/storage/raft/snapshot and nothing else.
  baoRole: openbao-snapshot

  # One entry per retention tier. `prefix` is where its objects go, so a
  # lifecycle rule on the store can expire tiers differently.
  jobs:
    - name: openbao-snapshot
      schedule: "17 */6 * * *"
      prefix: raft/
    - name: openbao-snapshot-weekly
      schedule: "47 3 * * 0"
      prefix: weekly/

  timeZone: Etc/UTC
  startingDeadlineSeconds: 3600
  activeDeadlineSeconds: 900
  backoffLimit: 2
  workSizeLimit: 2Gi
  nodeSelector: {}
  tolerations: []

  image:
    repository: openbao/openbao
    tag: "2.6.2"
    digest: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

  # Where a verified snapshot goes. The container's contract: read
  # /work/openbao.snap and /work/taken-at, store the bytes under
  # $SNAPSHOT_PREFIX<taken-at>.snap. Supply `command` for any store, or
  # turn on the s3 preset below.
  upload:
    image:
      repository: amazon/aws-cli
      tag: "2.36.44"
      digest: ""
      pullPolicy: ""
    command: []
    args: []
    env: []
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    s3:
      enabled: false
      bucket: ""
      region: ""
      checksumAlgorithm: SHA256

# ---------------------------------------------------------------------------
restoreCheck:
  enabled: false
  serviceAccountName: openbao-restore-check
  serviceAccountAnnotations: {}
  annotations: {}
  # The role the check logs in as on the RESTORED copy. It needs to read
  # the canaries and, with pki.enabled, issue from the check's PKI role.
  baoRole: openbao-restore-check

  schedule: "37 5 * * 0"
  timeZone: Etc/UTC
  startingDeadlineSeconds: 3600
  activeDeadlineSeconds: 1200
  backoffLimit: 1
  workSizeLimit: 2Gi
  nodeId: restore-check
  nodeSelector: {}
  tolerations: []

  # Twelve hours. A newest snapshot older than this means the snapshot job
  # stopped and nobody noticed — which is the failure this check exists to
  # find, so it fails rather than passing on old data.
  maxSnapshotAgeSeconds: 43200

  image:
    repository: openbao/openbao
    tag: "2.6.2"
    digest: ""
    pullPolicy: ""

  # Raw HCL for the scratch server's seal stanza. Empty: no seal, which
  # works for an unsealed test but not for a snapshot from an auto-unsealed
  # cluster — that needs the same seal, or a replica of its key. Pointing
  # it at a key replica in another region proves a snapshot opens without
  # the primary region.
  sealConfig: ""
  # How the pass line names that seal, e.g. "the unseal key's replica in
  # <region>". Empty: not named.
  sealDescription: ""
  # Raw HCL for the scratch server's audit devices. OpenBAO refuses
  # API-created audit devices, so the restored audit table only finds its
  # device if the scratch server declares it exactly as production does.
  auditConfig: |
    audit "file" "to-stdout" {
      options {
        file_path = "stdout"
      }
    }
  # Environment for the scratch server, e.g. the seal's region.
  serverEnv: []
  serverResources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

  # Where the newest snapshot comes from. The container's contract: write
  # it to /work/openbao.snap and its name to /work/key, and FAIL if the
  # newest is older than $MAX_SNAPSHOT_AGE_SECONDS.
  fetch:
    image:
      repository: amazon/aws-cli
      tag: "2.36.44"
      digest: ""
      pullPolicy: ""
    command: []
    args: []
    env: []
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    s3:
      enabled: false
      bucket: ""
      region: ""
      prefix: raft/

  # Read a known value back in every namespace. Judging a restore on the
  # process exiting zero proves only that a process ran.
  #
  # The canary's contract: in each namespace, <kvMount>/<path> is a KV v2
  # secret whose data is exactly {namespace: <that namespace's name>}. A
  # value that names its own namespace also catches a restore that mixed
  # namespaces up.
  canary:
    enabled: true
    kvMount: kv
    path: restore-canary
    # Empty: every namespace the restored copy lists (sys/namespaces).
    # Listing none is then a failure, not a pass.
    namespaces: []

  # Walk the restored PKI from a root YOU hold, then issue from it. This
  # proves the PKI survived as an authority — keys, issuers and roles — not
  # merely as bytes, and that it is still the hierarchy you trust rather
  # than one that merely agrees with itself.
  #
  # The shape is a two-tier hierarchy under an offline root: one domain
  # intermediate in the root namespace, and one issuing CA per namespace.
  pki:
    enabled: false
    # The committed root the walk starts from: base64 PEM, and a name for
    # the logs.
    trustAnchor:
      name: ""
      certificate: ""
    # The domain intermediate the root signed: <mount>/issuer/<issuer>.
    intermediate:
      mount: pki-int
      issuer: ""
    # Each namespace's issuing CA: <ns>/<mount>/issuer/<issuerPrefix>-<ns>.
    issuing:
      mount: pki
      issuerPrefix: ""
    # The namespaces with an issuing CA. One leaf is issued in each.
    namespaces: []
    # The role the leaves are issued from (<issuing.mount>/issue/<role>):
    # it should allow exactly one name per namespace, <role>.<ns>.<domain>.
    role: restore-check
    domain: ""
    ttl: 1h
    # Prove the role refuses what it must: a wildcard, a subdomain, an IP,
    # URI or e-mail SAN. Run in one namespace; empty: the first listed.
    refusals:
      enabled: true
      namespace: ""

# ---------------------------------------------------------------------------
# A daily check of the serving certificate's end date. The certificate is
# typically renewed THROUGH OpenBAO, so a renewal that keeps failing is
# silent until the certificate ends — and then every client stops at once.
# This reads the Certificate's status.notAfter (what cert-manager last wrote
# into the Secret) and, once fewer than alertBeforeSeconds are left, alerts
# and fails. Reading it needs `get` on that one Certificate and no access to
# any Secret.
certificateExpiry:
  enabled: false
  # The ServiceAccount, Role, RoleBinding and CronJob.
  name: openbao-tls-expiry
  annotations: {}
  # The Certificate to watch. Empty: server.tlsSecretName.
  certificateName: ""
  # For the alert text: which cluster, and cert-manager's namespace.
  clusterName: ""
  certManagerNamespace: cert-manager
  # Daily: one alert a day while it lasts, not one an hour.
  schedule: "23 7 * * *"
  timeZone: Etc/UTC
  startingDeadlineSeconds: 3600
  activeDeadlineSeconds: 300
  backoffLimit: 0
  # 21 days: with renewal starting 30 days before the end, nine days of
  # failed renewals — and three weeks before anything breaks.
  alertBeforeSeconds: 1814400
  # How long before its end the certificate renews, for the alert text.
  # 0: derived from serverCertificate.renewBefore (hours).
  renewBeforeSeconds: 0
  nodeSelector: {}
  tolerations: []

  read:
    image:
      repository: alpine/kubectl
      tag: "1.34.2"
      digest: ""
      pullPolicy: ""
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  # What alerts. The container's contract: read /work/status — three
  # lines: notAfter, the Ready condition's status, its message — and when
  # fewer than $ALERT_BEFORE_SECONDS are left, alert and exit non-zero.
  # Supply `command` for any channel, or turn on one of the presets below.
  # Exactly one of them: two channels from one job is two implementations
  # of one contract.
  alert:
    image:
      repository: amazon/aws-cli
      tag: "2.36.44"
      digest: ""
      pullPolicy: ""
    command: []
    args: []
    env: []
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    sns:
      enabled: false
      topicArn: ""
      region: ""
      # A last line for the message: where the way back is written down.
      runbook: ""
    # The other shipped implementation: one alert posted to the
    # Alertmanager v2 API, for an estate whose alerts already arrive that
    # way — Alertmanager itself, or whatever vmalert sends to — and which
    # has no SNS.
    alertmanager:
      enabled: false
      # Where Alertmanager answers, e.g. http://alertmanager.example.svc:9093.
      # The alert is posted to <url>/api/v2/alerts: the path is the API's,
      # not a value, and a url that is not http(s) fails the render.
      url: ""
      # The labels the alert carries. A route matches on labels, so which
      # ones they are is the consumer's decision, not this chart's.
      # `release` is what tells two OpenBAO installs apart; empty leaves
      # the label out. It is a value like every other name here — Helm's
      # own release name is never rendered into anything.
      alertname: OpenBAOCertificateExpiring
      severity: warning
      release: ""
      # An annotation on the alert: where the way back is written down.
      runbook: ""
      # This preset's own image, because `alert.image` above defaults to
      # the AWS CLI — the SNS preset's tool, and no HTTP client. Anything
      # with a POSIX shell and curl does; the container assumes busybox's
      # `date`, which is the stricter of the two.
      image:
        repository: curlimages/curl
        tag: "8.22.0"
        digest: ""
        pullPolicy: ""


# ---------------------------------------------------------------------------
# The watches. Each one asks a question no other part of an install answers,
# writes the whole report, and hands it to one alert container:
#
#   snapshotAge     is there a fresh backup where the backups are kept?
#   jobSuccess      have these jobs actually SUCCEEDED lately?
#   rootGeneration  is someone generating a root token?
#
# They exist because the failure each watches for is silent. A snapshot job
# can be green while the store is empty; a CronJob that stops being
# scheduled never produces a failed Job; a root token is generated without
# using any credential that could be revoked.
#
# All three deliver through the same contract as certificateExpiry, with the
# same two presets, so an estate configures one channel and not three:
# a probe writes /work/alert — the first line a summary, the rest the
# description — and the alert container delivers it and exits non-zero.
# An empty report is silence.

# Is there a fresh backup where the backups are kept? Every other way of
# asking watches the snapshot JOB; this asks the store, which is where a
# restore will look. Several stores may be listed: a copy in another region
# only counts if it is still arriving, and a replica that stops getting
# newer is what a stalled replication looks like from the data's side —
# which needs nothing but a listing, where a replication metric needs the
# store to publish one.
snapshotAge:
  enabled: false
  # The ServiceAccount and the CronJob.
  name: openbao-snapshot-age
  annotations: {}
  # Where the store's credential is attached, on the clouds that do it that
  # way. Merged over `annotations` on the ServiceAccount alone.
  serviceAccountAnnotations: {}
  # For the alert text: which cluster's backups these are.
  clusterName: ""

  # Hourly. The question is only worth asking between snapshots, and the
  # answer does not change in between — but a stale store found an hour
  # after it goes stale is a day of warning rather than a week's.
  schedule: "13 * * * *"
  timeZone: Etc/UTC
  startingDeadlineSeconds: 600
  activeDeadlineSeconds: 300
  # A retry would deliver the same alert twice, and the next run is an
  # hour away.
  backoffLimit: 0
  nodeSelector: {}
  tolerations: []

  # Where backups are kept, one entry per place. `maxAgeSeconds` is how old
  # the newest snapshot there may be: the schedule that fills it, times the
  # number of consecutive misses that should pass unnoticed (none), plus
  # what a copy takes to arrive. With snapshot.jobs taking one every 6
  # hours, 12 hours is two missed runs — the same limit the restore check
  # refuses to pass on (restoreCheck.maxSnapshotAgeSeconds).
  stores: []
  #  - name: primary
  #    # For the alert text: where this store is, in words.
  #    description: the backup account, in the primary region
  #    prefix: raft/
  #    maxAgeSeconds: 43200
  #    s3:
  #      enabled: true
  #      bucket: ""
  #      region: ""
  #    # For a `list.command` that reaches more than one store.
  #    env: []

  # How a store is looked in. The container's contract: with
  # $SNAPSHOT_PREFIX and $STORE_NAME, write the NAME of the newest object
  # under that prefix to /work/newest/$STORE_NAME — an empty file when
  # there is none — and exit ZERO even when the store cannot be reached,
  # leaving the reason in /work/error/$STORE_NAME. A probe that fails the
  # pod tells nobody: the alert container never runs, and a store nothing
  # can reach is exactly the case worth hearing about.
  #
  # It reads no object. What it needs is a list of one prefix, which is
  # strictly less than the snapshot job's own write and less than the
  # restore check's read.
  list:
    image:
      repository: amazon/aws-cli
      tag: "2.36.44"
      digest: ""
      pullPolicy: ""
    command: []
    args: []
    env: []
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi

  # Turns the listings into the report. It makes no cloud call: any image
  # with a POSIX shell and a `date` that reads "YYYY-MM-DD hh:mm:ss" does,
  # and this is the default tool image the rest of the chart already pulls.
  check:
    image:
      repository: amazon/aws-cli
      tag: "2.36.44"
      digest: ""
      pullPolicy: ""
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

  # What alerts. The container's contract: read /work/alert — the first
  # line a summary, the rest the description — and when it is not empty,
  # deliver it and exit non-zero. Supply `command` for any channel, or turn
  # on one of the presets. Exactly one of them: two channels from one job
  # is two implementations of one contract.
  alert:
    image:
      repository: amazon/aws-cli
      tag: "2.36.44"
      digest: ""
      pullPolicy: ""
    command: []
    args: []
    env: []
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    sns:
      enabled: false
      topicArn: ""
      region: ""
      # A last line for the message: where the way back is written down.
      runbook: ""
    alertmanager:
      enabled: false
      # Where Alertmanager answers, e.g. http://alertmanager.example.svc:9093.
      # The alert is posted to <url>/api/v2/alerts: the path is the API's,
      # not a value, and a url that is not http(s) fails the render.
      url: ""
      alertname: OpenBAOSnapshotStale
      severity: critical
      release: ""
      runbook: ""
      # This preset's own image, because `alert.image` defaults to the AWS
      # CLI — the SNS preset's tool, and no HTTP client.
      image:
        repository: curlimages/curl
        tag: "8.22.0"
        digest: ""
        pullPolicy: ""

# ---------------------------------------------------------------------------
# Have these jobs SUCCEEDED lately? Not "did one fail": a CronJob that stops
# being scheduled at all — suspended by a hand, orphaned by a controller,
# deleted with the release that owned it — never produces a failed Job, so
# "no failures" is not "working". status.lastSuccessfulTime is the field
# that answers the question that was asked, and it needs `get` on those
# CronJobs and nothing else.
#
# An estate with a metrics pipeline gets this fleet-wide, over every job it
# runs, and should prefer that: turn this off and let the fleet-wide rule
# cover these jobs with the rest. This is for an install that has no such
# pipeline, which should still not be able to stop backing itself up in
# silence.
jobSuccess:
  enabled: false
  name: openbao-job-success
  annotations: {}
  serviceAccountAnnotations: {}
  clusterName: ""

  schedule: "43 * * * *"
  timeZone: Etc/UTC
  startingDeadlineSeconds: 600
  activeDeadlineSeconds: 300
  backoffLimit: 0
  nodeSelector: {}
  tolerations: []

  # The CronJobs that must have succeeded, and how long is too long for
  # each: its own period plus the slack a late run needs. They are granted
  # by name in the Role, so this list is also the whole of what this job
  # may read.
  cronJobs: []
  #  - name: openbao-restore-check
  #    description: the weekly restore that proves a snapshot still opens
  #    # Nine days: weekly, plus two for a run that starts late.
  #    maxAgeSeconds: 777600

  read:
    image:
      repository: alpine/kubectl
      tag: "1.34.2"
      digest: ""
      pullPolicy: ""
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  alert:
    image:
      repository: amazon/aws-cli
      tag: "2.36.44"
      digest: ""
      pullPolicy: ""
    command: []
    args: []
    env: []
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    sns:
      enabled: false
      topicArn: ""
      region: ""
      runbook: ""
    alertmanager:
      enabled: false
      url: ""
      alertname: OpenBAOJobNotSucceeding
      severity: critical
      release: ""
      runbook: ""
      image:
        repository: curlimages/curl
        tag: "8.22.0"
        digest: ""
        pullPolicy: ""

# ---------------------------------------------------------------------------
# Is someone generating a root token? A root token is bound by no policy and
# expires on no schedule, and generating one needs a quorum of the
# recovery-key holders rather than any existing credential — so it is the
# move that both a legitimate break-glass and a successful theft of the
# recovery shares look like.
#
# sys/generate-root-token/attempt reports an attempt that is OPEN. The
# ceremony is deliberately slow, because it takes a share from each of
# several people, so a poll faster than the ceremony sees it; it does not
# see one that started and finished between two runs, and nothing is left
# behind afterwards to find. The record of a COMPLETED generation is in the
# audit device, and reading that needs somewhere to keep the audit stream.
# Run this and keep the audit log; neither is the other.
rootGeneration:
  enabled: false
  name: openbao-root-generation
  annotations: {}
  serviceAccountAnnotations: {}
  clusterName: ""
  # The OpenBAO role the watch logs in as. It should be able to read
  # sys/generate-root-token/attempt and nothing else.
  baoRole: openbao-root-generation

  # Every five minutes, which is inside the ceremony rather than inside the
  # single API call that ends it. Faster costs a pod each time; slower stops
  # being a watch.
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  startingDeadlineSeconds: 120
  activeDeadlineSeconds: 120
  backoffLimit: 0
  nodeSelector: {}
  tolerations: []

  image:
    repository: openbao/openbao
    tag: "2.6.2"
    digest: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

  alert:
    image:
      repository: amazon/aws-cli
      tag: "2.36.44"
      digest: ""
      pullPolicy: ""
    command: []
    args: []
    env: []
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    sns:
      enabled: false
      topicArn: ""
      region: ""
      runbook: ""
    alertmanager:
      enabled: false
      url: ""
      alertname: OpenBAORootTokenGeneration
      severity: critical
      release: ""
      runbook: ""
      image:
        repository: curlimages/curl
        tag: "8.22.0"
        digest: ""
        pullPolicy: ""

# ---------------------------------------------------------------------------
networkPolicy:
  enabled: false
  annotations: {}
  names:
    serverIngress: openbao-ingress
    restoreCheckIngress: openbao-restore-check-ingress
    certificateExpiryIngress: openbao-tls-expiry-ingress
    snapshotAgeIngress: openbao-snapshot-age-ingress
    jobSuccessIngress: openbao-job-success-ingress
    rootGenerationIngress: openbao-root-generation-ingress
  # Where clients live. Required when enabled.
  clientCidrs: []
  # Anything else that may reach the API, as raw NetworkPolicyPeer entries.
  extraClientSelectors: []
  # More pods nothing may connect to — anything else that holds a restored
  # copy, such as a hand-run rebuild drill. One ingress-deny policy each.
  isolated: []
  #  - name: openbao-drill-ingress
  #    podSelector:
  #      app.kubernetes.io/name: openbao-drill
  # Egress, as whole policies. Standard NetworkPolicy is CIDR-based, and
  # naming hostnames needs a CNI extension whose shape differs by provider,
  # so a rule may set its own apiVersion and kind.
  egress:
    enabled: false
    rules: []
    #  - name: openbao-egress
    #    apiVersion: networking.k8s.io/v1       # default
    #    kind: NetworkPolicy                    # default
    #    podSelector:
    #      app.kubernetes.io/name: openbao
    #      component: server
    #    egress:
    #      - to: [{ipBlock: {cidr: 10.0.0.0/16}}]
    #        ports: [{port: 443, protocol: TCP}]

# ---------------------------------------------------------------------------
serverCertificate:
  enabled: false
  # The name a client outside the cluster uses. Prepended to the SAN list.
  externalDnsName: ""
  # Empty: externalDnsName, when set.
  commonName: ""
  # The Services' in-cluster names and a wildcard over the peers. Turn it
  # off when the chain is name-constrained and cannot carry them; clients
  # then verify externalDnsName instead (server.tlsServerName, and the
  # upstream chart's BAO_TLS_SERVER_NAME and leader_tls_servername).
  serviceDnsNames: true
  extraDnsNames: []
  ipAddresses:
    - 127.0.0.1
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: ""
    kind: ClusterIssuer
    group: cert-manager.io
  annotations: {}

# ---------------------------------------------------------------------------
# A fragment for the UPSTREAM server chart's server.extraContainers, not an
# object of its own — see docs/server.md.
tlsReload:
  intervalSeconds: 60
  certPath: /openbao/userconfig/openbao-tls/tls.crt
  volumeName: userconfig-openbao-tls
  mountPath: /openbao/userconfig/openbao-tls
  image:
    repository: openbao/openbao
    tag: "2.6.2"
    digest: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      memory: 32Mi
