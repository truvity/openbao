      image:
        repository: curlimages/curl
        tag: "8.22.0"
        digest: ""
        pullPolicy: ""

# ---------------------------------------------------------------------------
# Are the plugins pkg/serverpreset declares actually IN the catalog, at the
# version a mount will ask for? OpenBAO downloads an OCI plugin
# declaratively at startup, and the default download behaviour
# (plugin_download_behavior = "continue") lets the server start anyway when
# that download fails, with the plugin simply missing until something
# retries it (docs/server.md "The plugin catalog: three faults, fixed
# once") — so a failed download is silent until a mount tries to use the
# plugin. This complements a log-based alert on "failed to download
# plugin": it asks the catalog itself, on a schedule, rather than only
# whichever pipeline happens to watch the server's own log lines.
#
# sys/plugins/catalog/<type>/<name> is the ground truth: the declarative
# path is the only one that can register a catalog entry pointing into the
# OCI cache (an API registration of the same entry is refused). A missing
# entry, or one at the wrong version, is reported the same way a stale
# snapshot is.
pluginCatalog:
  enabled: false
  name: openbao-plugin-catalog
  annotations: {}
  serviceAccountAnnotations: {}
  clusterName: ""
  # The OpenBAO role the watch logs in as. Reading a sys/ path needs BOTH
  # capabilities below, not read alone — it should have exactly:
  #   path "sys/plugins/catalog/<type>/<name>" {
  #     capabilities = ["read", "sudo"]
  #   }
  # for each entry in `plugins`, and nothing else.
  baoRole: openbao-plugin-catalog

  # Hourly: a plugin does not change outside a deliberate rollout, and the
  # rollout runbook (docs/server.md) already checks the catalog by hand
  # before trusting a change — this is what notices a download that never
  # arrived in between.
  schedule: "58 * * * *"
  timeZone: Etc/UTC
  startingDeadlineSeconds: 600
  activeDeadlineSeconds: 300
  # A retry would deliver the same alert twice, and the next run is an
  # hour away.
  backoffLimit: 0
  nodeSelector: {}
  tolerations: []

  image:
    repository: openbao/openbao
    tag: "2.6.2"
    digest: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

  # One entry per plugin pkg/serverpreset's Config declares. `type` is the
  # plugin's catalog type (the first label of its `plugin` HCL block):
  # "auth", "secret" or "database". This list is also the whole of what
  # the watch's role may read, named entry by entry.
  plugins: []
  #  - type: secret
  #    name: openbao-plugin-example
  #    version: v1.2.3
  #    description: the example secrets engine
  #    # Optional: fail the entry too when it does not report these. Only
  #    # the declarative path can set either, so a false here on an entry
  #    # that otherwise matches is a catalog entry an API call created —
  #    # proof the download itself never actually ran.
  #    oci: true
  #    declarative: true

  alert:
    image:
      repository: amazon/aws-cli
      tag: "2.36.44"
      digest: ""
      pullPolicy: ""
    command: []
    args: []
    env: []
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    sns:
      enabled: false
      topicArn: ""
      region: ""
      runbook: ""
    alertmanager:
      enabled: false
      url: ""
      alertname: OpenBAOPluginMissing
      severity: critical
      release: ""
      runbook: ""
      image:
        repository: curlimages/curl
        tag: "8.22.0"
        digest: ""
        pullPolicy: ""

# ---------------------------------------------------------------------------
# The server's own metrics: a PodMonitor, and alerts on what they say.
#
# The metrics are served by a listener of their own at /v1/sys/metrics: it
# sets metrics_only (every other path is refused) and
# unauthenticated_metrics_access (no token), and the API listener sets
# neither. The server's telemetry stanza sets prometheus_retention_time.
# serverpreset renders all of it (docs/server.md, "Metrics"). Without it the
# scrape gets 403 or a refused connection and every alert here is blind.
#
# Both objects need a CRD the cluster may not have, so the whole part is off
# until enabled.
serverMetrics:
  enabled: false

  # The metrics listener's port: the one port networkPolicy.serverIngress
  # admits the scraper to. It must be the port of the listener serverpreset
  # renders (Telemetry.MetricsAddress), and differ from server.apiPort and
  # server.clusterPort.
  # 9101, not 8202: the upstream openbao chart already declares 8202 (replication).
  port: 9101

  podMonitor:
    enabled: true
    name: openbao-server
    # Where the object lives. Default: the release namespace. The CA Secret
    # (server.tlsSecretName) must be in the same namespace as the object.
    namespace: ""
    labels: {}
    annotations: {}
    # The NAME of the container port the metrics listener is on (serverMetrics.
    # port). The server pods must declare a container port of this name.
    port: metrics
    interval: 30s
    scrapeTimeout: 10s

  # Who may scrape, for networkPolicy.serverIngress: one ingress rule on the
  # metrics port (serverMetrics.port, and only that port) for these peers
  # (raw NetworkPolicyPeer entries, e.g. a namespaceSelector with a
  # podSelector for the metrics agent). The API and cluster ports stay as
  # the other rules leave them: the scraper gets neither. Empty: no rule.
  scraper: []

  alerts:
    enabled: false
    # vmrule         VMRule (operator.victoriametrics.com/v1beta1)
    # prometheusrule PrometheusRule (monitoring.coreos.com/v1)
    # configmap      the plain Prometheus rules file, under one key
    format: vmrule
    # Object name. Default: <release>-server-alerts.
    name: ""
    # Where the object lives. Default: the release namespace.
    namespace: ""
    # Labels on the OBJECT (an operator's ruleSelector matches these) and
    # annotations on it.
    labels: {}
    annotations: {}
    # Labels added to EVERY rule, for routing. A rule's own `labels` are
    # merged over these; `severity` is set per rule.
    ruleLabels: {}
    groupName: openbao-server
    interval: ""
    # Extra label matchers, comma separated and inside no braces, added to
    # every selector after namespace="<release namespace>" — for a store
    # that holds several clusters, e.g. `k8s_cluster_name="example"`.
    selector: ""

    # Per rule: `enabled`, `for` (how long the condition must hold),
    # `severity`, `labels` and `annotations` (merged over the rule's), and
    # the threshold the rule has. Backups are NOT here: snapshotAge and
    # jobSuccess already alert on a stale or failed snapshot, from the
    # store itself.
    rules:
      # A pod that is sealed serves nothing. With auto-unseal it should not
      # stay that way past its start.
      sealed:
        enabled: true
        for: 5m
        severity: critical
        labels: {}
        annotations: {}
      # No pod is active: no leader, so no client is served.
      noActiveNode:
        enabled: true
        for: 3m
        severity: critical
        labels: {}
        annotations: {}
      # Autopilot, read from the active node: fewer healthy voters than
      # minHealthyVoters, or the cluster reported unhealthy.
      raftUnhealthy:
        enabled: true
        for: 10m
        severity: warning
        minHealthyVoters: 3
        labels: {}
        annotations: {}
      # A follower more than maxIndexDelta Raft log entries behind the
      # leader (vault_raft_storage_follower_applied_index_delta).
      raftCommitLag:
        enabled: true
        for: 10m
        severity: warning
        maxIndexDelta: 500
        labels: {}
        annotations: {}
      # The audit devices failed to log a request or a response: OpenBAO
      # refuses what it cannot audit.
      auditFailures:
        enabled: true
        for: 2m
        severity: critical
        labels: {}
        annotations: {}
      # p99 of non-login request handling, in milliseconds.
      highLatency:
        enabled: true
        for: 15m
        severity: warning
        thresholdMilliseconds: 1000
        labels: {}
        annotations: {}
      # A scrape target of the PodMonitor is down.
      scrapeDown:
        enabled: true
        for: 10m
        severity: warning
        labels: {}
        annotations: {}
      # No vault_core_unsealed series at all: nothing is scraped, or the
      # listener's telemetry is off.
      metricsAbsent:
        enabled: true
        for: 15m
        severity: warning
        labels: {}
        annotations: {}

# ---------------------------------------------------------------------------
# Alerts on the server's own LOG, for a failure that has no metric.
#
# OpenBAO exports no gauge for a declarative plugin download. With
# plugin_download_behavior "continue" a failed download never crash-loops
# the server: it starts, or keeps running, without the plugin until something
# SIGHUPs it, and nothing else in the install says a word about it. These
# rules make that loud. They are LogsQL, read by a log ruler (vmalert against
# VictoriaLogs), so the object carries the label that routes it there and
# away from the metrics ruler. See the chart README.
serverAlerts:
  pluginDownload:
    enabled: false
    # Only the VMRule format exists: LogsQL has no PrometheusRule form.
    format: vmrule
    # Object name. Default: <release>-plugin-download.
    name: ""
    # Where the object lives. Default: the release namespace.
    namespace: ""
    # Labels on the OBJECT. The default routes it to the LogsQL ruler.
    labels:
      observability.rule-type: vlogs
    annotations: {}
    # Labels added to EVERY rule; a rule's own `labels` are merged over them.
    ruleLabels: {}
    groupName: OpenBAOPluginCatalog
    # Whole minutes. This is also the lookback: the rules carry no time
    # filter and the ruler applies the group interval, so the interval IS
    # the window and the debounce (`for` stays unset).
    interval: 15m
    # When set: the k8s_cluster_name label of every rule, and " on <name>"
    # in the first summary.
    clusterName: ""
    # Required: the plugin whose download is watched ("auth/aws"), named in
    # the alert text.
    plugin: ""
    # Optional reference (a decision record) rendered as " (<text>)" after
    # `stays "continue" permanently` in the first description.
    decision: ""
    # Optional: the `runbook` annotation of both rules.
    runbook: ""
    # The server's container (the log lines come from it), in the namespace
    # the server runs in (`namespace` above, else the release namespace).
    serverContainer: openbao
    # The retry sidecar of pkg/serverpreset (RetrySidecarContainer or
    # TLSReloadSidecarContainer): its container name, the attempts it makes
    # (the "giving up after N attempts" line it logs), and the minutes those
    # attempts take, for the text.
    sidecar:
      container: tls-reload
      attempts: 20
      budgetMinutes: 10
    rules:
      # A failed download with no success in the same window.
      downloadFailing:
        enabled: true
        for: ""
        severity: warning
        labels: {}
        annotations: {}
      # The sidecar exhausted its attempts.
      sidecarGaveUp:
        enabled: true
        for: ""
        severity: warning
        labels: {}
        annotations: {}

# ---------------------------------------------------------------------------
networkPolicy:
  enabled: false
  annotations: {}
  names:
    serverIngress: openbao-ingress
    restoreCheckIngress: openbao-restore-check-ingress
    certificateExpiryIngress: openbao-tls-expiry-ingress
    snapshotAgeIngress: openbao-snapshot-age-ingress
    jobSuccessIngress: openbao-job-success-ingress
    rootGenerationIngress: openbao-root-generation-ingress
    pluginCatalogIngress: openbao-plugin-catalog-ingress
  # Where clients live. Required when enabled.
  clientCidrs: []
  # Anything else that may reach the API, as raw NetworkPolicyPeer entries.
  extraClientSelectors: []
  # More pods nothing may connect to — anything else that holds a restored
  # copy, such as a hand-run rebuild drill. One ingress-deny policy each.
  isolated: []
  #  - name: openbao-drill-ingress
  #    podSelector:
  #      app.kubernetes.io/name: openbao-drill
  # Egress, as whole policies. Standard NetworkPolicy is CIDR-based, and
  # naming hostnames needs a CNI extension whose shape differs by provider,
  # so a rule may set its own apiVersion and kind.
  egress:
    enabled: false
    rules: []
    #  - name: openbao-egress
    #    apiVersion: networking.k8s.io/v1       # default
    #    kind: NetworkPolicy                    # default
    #    podSelector:
    #      app.kubernetes.io/name: openbao
    #      component: server
    #    egress:
    #      - to: [{ipBlock: {cidr: 10.0.0.0/16}}]
    #        ports: [{port: 443, protocol: TCP}]

# ---------------------------------------------------------------------------
serverCertificate:
  enabled: false
  # The name a client outside the cluster uses. Prepended to the SAN list.
  externalDnsName: ""
  # Empty: externalDnsName, when set.
  commonName: ""
  # The Services' in-cluster names and a wildcard over the peers. Turn it
  # off when the chain is name-constrained and cannot carry them; clients
  # then verify externalDnsName instead (server.tlsServerName, and the
  # upstream chart's BAO_TLS_SERVER_NAME and leader_tls_servername).
  serviceDnsNames: true
  extraDnsNames: []
  ipAddresses:
    - 127.0.0.1
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: ""
    kind: ClusterIssuer
    group: cert-manager.io
  annotations: {}

# ---------------------------------------------------------------------------
# A fragment for the UPSTREAM server chart's server.extraContainers, not an
# object of its own — see docs/server.md.
tlsReload:
  intervalSeconds: 60
  certPath: /openbao/userconfig/openbao-tls/tls.crt
  volumeName: userconfig-openbao-tls
  mountPath: /openbao/userconfig/openbao-tls
  image:
    repository: openbao/openbao
    tag: "2.6.2"
    digest: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      memory: 32Mi
