apiVersion: v2
name: openbao-consumers
description: >-
  The cluster side of an OpenBAO install: External Secrets
  ClusterSecretStores on the Vault provider (readers, and writers that
  present their own ServiceAccount token), a cert-manager issuer backed by
  OpenBAO's PKI, the trust bundle that makes what it issues verifiable, and
  workload certificates. The server itself is elsewhere.
type: application
