# Values for the UPSTREAM external-secrets chart (charts.external-secrets.io),
# for a cluster whose stores read from and write to OpenBAO
# (charts/openbao-consumers `stores`, `writers`). Pass this file with `-f`
# (or Argo CD `valueFiles`) BEFORE your own values; your values win where
# they set the same key. Scheduling constraints are yours to add.
#
# What it sets, and why:
#   - the CRDs are installed with the chart;
#   - the controller, webhook and cert-controller are scraped
#     (ServiceMonitor; one key renders the three metrics Services and the
#     three monitors);
#   - requests on every component, so the pods are not the first
#     probe-kill victims under node contention.
installCRDs: true
serviceMonitor:
  enabled: true
resources:
  requests: {cpu: 100m, memory: 256Mi}
webhook:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
certController:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
