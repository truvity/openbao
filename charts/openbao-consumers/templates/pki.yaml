{{- if .Values.pki.enabled }}
{{- $pki := .Values.pki }}
{{- $ns := $pki.certManager.namespace }}
{{- $registry := dict }}
{{- if not $pki.trustAnchors }}
{{- fail "pki.trustAnchors is empty — an issuer whose chain nothing trusts issues certificates nobody accepts" }}
{{- end }}
{{- if $pki.issuers }}
{{- if not .Values.server }}
{{- fail "server is required when pki.issuers is set — cert-manager has nowhere to ask for a certificate" }}
{{- end }}
{{- if not .Values.caBundle }}
{{- fail "caBundle is required when pki.issuers is set — without it cert-manager cannot verify the server it is about to send a token to" }}
{{- end }}
{{- end }}
{{- range $anchor := $pki.trustAnchors }}
{{- if not (and $anchor.name $anchor.certificate) }}
{{- fail "every entry of pki.trustAnchors needs a name and a certificate" }}
{{- end }}
{{- include "consumers.claim" (dict "registry" $registry "kind" "ConfigMap" "namespace" $ns "name" $anchor.name "by" (printf "pki.trustAnchors.%s" $anchor.name)) }}
---
{{- /* A root, as material cert-manager and trust-manager can both read.
       Public certificate only: the key never leaves its custody. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $anchor.name }}
  namespace: {{ $ns }}
  {{- with include "consumers.annotations" (dict "root" $ "extra" (mergeOverwrite (deepCopy ($pki.annotations | default dict)) ($anchor.annotations | default dict))) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $anchor.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{ $pki.rootKey }}: |
{{ $anchor.certificate | b64dec | trimSuffix "\n" | indent 4 }}
{{- end }}
{{- if $pki.issuers }}
---
{{- /* cert-manager authenticates to OpenBAO as this ServiceAccount. It
       never holds a token: cert-manager mints one per request through the
       Role below, so there is no credential to rotate or leak. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $pki.issuerServiceAccount }}
  namespace: {{ $ns }}
  {{- with include "consumers.annotations" (dict "root" $ "extra" $pki.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-token" $pki.issuerServiceAccount }}
  namespace: {{ $ns }}
  {{- with include "consumers.annotations" (dict "root" $ "extra" $pki.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: [{{ $pki.issuerServiceAccount | quote }}]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-token" $pki.issuerServiceAccount }}
  namespace: {{ $ns }}
  {{- with include "consumers.annotations" (dict "root" $ "extra" $pki.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $pki.certManager.serviceAccountName }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-token" $pki.issuerServiceAccount }}
{{- end }}
{{- range $issuer := $pki.issuers }}
{{- if not (and $issuer.name $issuer.signPath $issuer.role) }}
{{- fail "every entry of pki.issuers needs a name, a signPath and a role" }}
{{- end }}
{{- $kind := $issuer.kind | default "ClusterIssuer" }}
{{- if not (has $kind (list "ClusterIssuer" "Issuer")) }}
{{- fail (printf "pki.issuers.%s: kind %q is neither ClusterIssuer nor Issuer" $issuer.name $kind) }}
{{- end }}
{{- include "consumers.claim" (dict "registry" $registry "kind" $kind "namespace" (ternary $ns "" (eq $kind "Issuer")) "name" $issuer.name "by" (printf "pki.issuers.%s" $issuer.name)) }}
---
{{- /* Two different CAs meet here and confusing them is the classic
       mistake: `caBundle` verifies OpenBAO's own HTTPS serving certificate
       — the server cert-manager is talking TO — while the trust anchors
       are what verify the certificates OpenBAO ISSUES. They are usually
       signed by different authorities and there is no reason for them to
       agree.

       Its name is part of its login: cert-manager always asks for a token
       with audience vault://<name> (vault://<namespace>/<name> for an
       Issuer), so the OpenBAO role can be bound to exactly this issuer.
       `audiences` adds more, to reach a role bound to another. */}}
apiVersion: cert-manager.io/v1
kind: {{ $kind }}
metadata:
  name: {{ $issuer.name }}
  {{- if eq $kind "Issuer" }}
  namespace: {{ $ns }}
  {{- end }}
  {{- with include "consumers.annotations" (dict "root" $ "extra" $issuer.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  vault:
    server: {{ $.Values.server | quote }}
    {{- with ($issuer.vaultNamespace | default $pki.vaultNamespace | default $.Values.vaultNamespace) }}
    namespace: {{ . }}
    {{- end }}
    path: {{ $issuer.signPath }}
    caBundle: {{ $.Values.caBundle | quote }}
    auth:
      kubernetes:
        role: {{ $issuer.role }}
        {{- /* The /v1/ prefix is required here and nowhere else:
               cert-manager passes this path through verbatim. */}}
        mountPath: {{ printf "/v1/auth/%s" $.Values.auth.mountPath }}
        serviceAccountRef:
          name: {{ $pki.issuerServiceAccount }}
          {{- with $issuer.audiences }}
          audiences:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- if $pki.bundle.enabled }}
---
{{- /* Every trust anchor, and whatever else is still trusted: carrying the
       old and the new root at once is what makes a root migration possible
       at all — leaves can be reissued in any order, and the old root is
       removed only once nothing presents it. A single-source bundle is a
       flag day. */}}
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: {{ $pki.bundle.name }}
  {{- with include "consumers.annotations" (dict "root" $ "extra" $pki.bundle.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  sources:
    {{- with $pki.bundle.extraSources }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- range $anchor := $pki.trustAnchors }}
    - configMap:
        name: {{ $anchor.name }}
        key: {{ $pki.rootKey }}
    {{- end }}
  target:
    configMap:
      key: {{ $pki.bundle.target.key }}
    namespaceSelector:
      {{- toYaml $pki.bundle.target.namespaceSelector | nindent 6 }}
{{- end }}
{{- end }}
