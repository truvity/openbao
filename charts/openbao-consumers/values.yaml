# openbao-consumers — the cluster side of an OpenBAO install.
#
# Runs on every cluster that CONSUMES an OpenBAO: the stores that read
# secrets from it, the stores that write back to it, and the cert-manager
# issuers, trust anchors, bundle and certificates that make its PKI usable.
# The server is elsewhere (openbao-ops, beside it).
#
# Everything particular — the endpoint, the CA, namespaces, role names,
# which workloads may read what — is an input. The chart supplies the
# shapes that are easy to get subtly wrong and hard to notice when you do.
#
# Stores and PKI are independent: an install may render either or both,
# which lets them sit in different deployments with their own ordering.

# Added to every object this chart renders. Per-object `annotations` are
# merged over it.
commonAnnotations: {}

# The OpenBAO endpoint, e.g. https://openbao.example.internal:8200
server: ""

# Base64 PEM of the CA that signed the SERVER's certificate. This verifies
# the endpoint a client is about to send a token to — it is not the root
# that verifies certificates OpenBAO issues, and the two are usually
# different authorities. Required whenever a store or an issuer renders.
caBundle: ""

# The OpenBAO namespace these objects address. Empty on an install with no
# namespaces.
vaultNamespace: ""

# The KV v2 mount every store reads from and writes to.
kvMount: kv

# Appended to a reader store's name, so a store on the Vault provider is
# distinguishable from a same-named one on another provider during a
# migration between the two.
storeSuffix: openbao

auth:
  # The JWT auth mount workloads on this cluster log in to. A mount is per
  # cluster, so estates usually name it after the cluster.
  mountPath: jwt
  # The audience the mount requires. A token minted for this audience
  # cannot be replayed against the Kubernetes API.
  audience: openbao
  # Ten minutes: long enough for a login, worth almost nothing if leaked.
  expirationSeconds: 600
  # The identity External Secrets itself presents, for reader stores.
  serviceAccount:
    name: external-secrets
    namespace: external-secrets

# A writer store presents its OWN ServiceAccount token instead, so nothing
# else on the cluster can write through it. The auth mount is this
# cluster's (empty: auth.mountPath); the Vault namespace is the target
# environment's.
writerAuthMount: ""

# Reader stores, one per kind. `role` defaults to the name, so the OpenBAO
# policy that bounds what a store may read is findable from the store.
stores: []
#  - name: example-app
#    role: example-app
#    vaultNamespace: ""          # default: the top-level vaultNamespace
#    annotations: {}
#    conditions:                 # required: without it every namespace can read
#      - namespaces: [example-app]

writers: []
#  - name: example-writer
#    namespace: example-system   # where its ServiceAccount lives
#    serviceAccount: openbao-writer
#    environments: [devel, prod] # one store per environment
#    annotations: {}

pki:
  enabled: false
  # On the objects cert-manager's login is made of (the ServiceAccount, its
  # token Role and RoleBinding) and on the trust anchors.
  annotations: {}

  certManager:
    namespace: cert-manager
    # cert-manager's own identity, which mints the issuers' tokens.
    serviceAccountName: cert-manager
  # The identity cert-manager presents to OpenBAO. It holds no token:
  # cert-manager mints one per request, so there is none to rotate.
  issuerServiceAccount: openbao-issuer
  # Default for every issuer: the top-level vaultNamespace when empty.
  vaultNamespace: ""

  # The ROOTS that verify what OpenBAO issues, one ConfigMap each in
  # certManager.namespace, and every one of them in the bundle. Public
  # certificates only: the keys never leave their custody.
  trustAnchors: []
  #  - name: example-root-2026
  #    certificate: <base64 PEM>
  #    labels: {}
  #    annotations: {}
  # The key each anchor's ConfigMap holds its certificate under.
  rootKey: ca.crt

  # cert-manager issuers backed by OpenBAO: one per signing path. A Vault
  # issuer's path is fixed, so a second chain or a second role is a second
  # issuer, not a change to the first.
  issuers: []
  #  - name: example-private
  #    kind: ClusterIssuer          # ClusterIssuer | Issuer
  #    signPath: pki/sign/example   # the OpenBAO role that bounds what it signs
  #    role: example-private        # the auth role cert-manager logs in as
  #    audiences: []                # extra token audiences for that login
  #    vaultNamespace: ""           # default: pki.vaultNamespace
  #    annotations: {}

  bundle:
    enabled: true
    name: openbao-private-ca
    annotations: {}
    # Sources placed BEFORE the trust anchors — during a root migration,
    # the OLD root. Trusting both is what lets leaves be reissued in any
    # order instead of on a flag day.
    extraSources: []
    target:
      key: ca-certificates.crt
      namespaceSelector: {}       # {} — every namespace

certificateDefaults:
  # A third of the lifetime: renewal gets two chances before anything
  # expires, so an outage in the issuer is survivable rather than immediate.
  duration: 720h
  renewBefore: 240h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always

# Certificates from an OpenBAO-backed issuer — typically one disposable
# smoke certificate per issuer, which proves the login, the chain and the
# renewal path before any workload changes its issuerRef.
certificates: []
#  - name: smoke
#    namespace: cert-manager      # default: pki.certManager.namespace
#    commonName: smoke.example.internal
#    dnsNames: []                 # default: [commonName]
#    secretName: ""               # default: <name>-tls
#    issuerRef: {}                # default: the first of pki.issuers
#    duration / renewBefore / privateKey: default certificateDefaults
#    annotations: {}
#    labels: {}
